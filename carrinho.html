<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#06060E">
<title>Carrinho | Angophones</title>
<link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --red: #EF4444;
  --green: #22C55E;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
}
[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 80px;
  transition: background 0.3s, color 0.3s;
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }
.hdr-nome {
  font-family: var(--ft);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  color: var(--white);
}
.hdr-nome span { color: var(--primary); }
.hb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.container { padding: 16px; max-width: 600px; margin: 0 auto; }
.carrinho-vazio {
  text-align: center;
  padding: 60px 20px;
}
.carrinho-vazio i {
  font-size: 4rem;
  color: var(--muted2);
  opacity: 0.3;
  margin-bottom: 16px;
}
.carrinho-vazio h2 {
  font-family: var(--ft);
  font-size: 1.5rem;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.carrinho-vazio p {
  color: var(--muted);
  margin-bottom: 24px;
}
.btn {
  display: inline-block;
  padding: 12px 24px;
  background: var(--grad);
  border: none;
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  color: white;
  text-decoration: none;
  cursor: pointer;
}
.carrinho-item {
  display: flex;
  gap: 12px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 10px;
}
.carrinho-item-img {
  width: 70px;
  height: 70px;
  border-radius: 12px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.carrinho-item-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.carrinho-item-img i {
  font-size: 2rem;
  color: var(--muted2);
  opacity: 0.5;
}
.carrinho-item-info {
  flex: 1;
  min-width: 0;
}
.carrinho-item-nome {
  font-family: var(--ft);
  font-size: 1rem;
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}
.carrinho-item-variante {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.carrinho-item-preco {
  font-family: var(--ft);
  font-size: 0.95rem;
  color: var(--primary);
  margin-bottom: 8px;
}
.carrinho-item-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.qty-control {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
}
.qty-btn {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: none;
  border: none;
  color: var(--white);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-btn:hover { background: var(--primary); color: white; }
.qty-val {
  min-width: 30px;
  text-align: center;
  font-weight: 600;
  font-size: 0.85rem;
}
.btn-remover {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: none;
  border: 1px solid var(--border);
  color: var(--red);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
}
.btn-remover:hover {
  background: var(--red);
  color: white;
  border-color: var(--red);
}
.resumo {
  margin-top: 20px;
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.resumo-titulo {
  font-family: var(--ft);
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
  color: var(--primary);
}
.resumo-linha {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: var(--muted);
}
.resumo-linha.total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-family: var(--ft);
  font-size: 1.2rem;
  color: var(--white);
}
.resumo-linha.total span:last-child {
  color: var(--primary);
}
.cupao-section {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.cupao-input {
  flex: 1;
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: var(--fb);
  font-size: 0.85rem;
  color: var(--white);
  outline: none;
  text-transform: uppercase;
}
.cupao-input::placeholder {
  color: var(--muted2);
  text-transform: none;
}
.cupao-input:focus {
  border-color: var(--primary);
}
.btn-cupao {
  padding: 12px 20px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: var(--ft);
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.btn-cupao:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.cupao-aplicado {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: rgba(255, 85, 0, 0.1);
  border: 1px solid rgba(255, 85, 0, 0.3);
  border-radius: 10px;
  margin-bottom: 16px;
}
.cupao-aplicado span {
  color: var(--primary);
  font-weight: 600;
}
.cupao-aplicado i {
  color: var(--green);
  margin-right: 6px;
}
.btn-remover-cupao {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 4px 8px;
}
.btn-finalizar {
  width: 100%;
  padding: 16px;
  background: var(--grad);
  border: none;
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 1rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255, 85, 0, 0.3);
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: 8px 16px 12px;
  display: flex;
  justify-content: space-around;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
}
[data-theme="light"] .bottom-nav { background: rgba(245, 245, 247, 0.97); }
.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-decoration: none;
}
.bottom-nav a i { font-size: 1.3rem; }
.bottom-nav a.active { color: var(--primary); }
.fab-whatsapp {
  position: fixed;
  bottom: 90px;
  right: 16px;
  width: 55px;
  height: 55px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
  z-index: 150;
  text-decoration: none;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  text-align: center;
  max-width: calc(100vw - 32px);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
@media (min-width: 769px) {
  .bottom-nav { display: none; }
  body { padding-bottom: 20px; }
  .fab-whatsapp { bottom: 24px; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-nome">Ango<span>phones</span></div>
  <button class="hb" onclick="alternarTema()">
    <i data-theme-ico class="fa-regular fa-sun"></i>
  </button>
</header>

<div class="container" id="carrinho-container">
  <div class="carrinho-vazio">
    <i class="fa-solid fa-cart-shopping"></i>
    <h2>Carrinho Vazio</h2>
    <p>Adicione produtos para continuar</p>
    <a href="loja.html" class="btn">Explorar Produtos</a>
  </div>
</div>

<a href="https://wa.me/244954288128?text=Ola!%20Gostaria%20de%20mais%20informacoes." class="fab-whatsapp" target="_blank">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<nav class="bottom-nav">
  <a href="index.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
  <a href="loja.html"><i class="fa-solid fa-mobile-screen"></i><span>Loja</span></a>
  <a href="carrinho.html" class="active"><i class="fa-solid fa-cart-shopping"></i><span>Carrinho</span></a>
  <a href="favoritos.html"><i class="fa-solid fa-heart"></i><span>Favoritos</span></a>
  <a href="sobre.html"><i class="fa-solid fa-circle-info"></i><span>Sobre</span></a>
</nav>

<div class="toast" id="toast"></div>

<script>
// ========== TEMA ==========
function alternarTema() {
  const html = document.documentElement;
  const icon = document.querySelector('[data-theme-ico]');
  const temaAtual = html.getAttribute('data-theme') || 'dark';
  const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
  
  html.setAttribute('data-theme', novoTema);
  localStorage.setItem('tema', novoTema);
  
  if (icon) {
    icon.className = novoTema === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
  
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#06060E' : '#F5F5F7');
}

(function() {
  const temaSalvo = localStorage.getItem('tema') || 'dark';
  document.documentElement.setAttribute('data-theme', temaSalvo);
  const icon = document.querySelector('[data-theme-ico]');
  if (icon) {
    icon.className = temaSalvo === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
})();

// ========== CARRINHO ==========
function getCarrinho() {
  const c = localStorage.getItem('angophones_carrinho');
  return c ? JSON.parse(c) : [];
}

function salvarCarrinho(carrinho) {
  localStorage.setItem('angophones_carrinho', JSON.stringify(carrinho));
}

function getCupao() {
  return JSON.parse(localStorage.getItem('angophones_cupao') || 'null');
}

function salvarCupao(cupao) {
  localStorage.setItem('angophones_cupao', JSON.stringify(cupao));
}

function getSubtotal() {
  return getCarrinho().reduce((t, i) => t + (i.preco * i.quantidade), 0);
}

function getDesconto() {
  const cupao = getCupao();
  if (!cupao) return 0;
  const subtotal = getSubtotal();
  if (cupao.tipo === 'percentual') return Math.round(subtotal * cupao.valor / 100);
  return Math.min(cupao.valor, subtotal);
}

function formatarKz(v) {
  return v.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  t.style.borderLeftColor = tipo === 'err' ? '#EF4444' : '#FF5500';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ========== RENDERIZAR ==========
function renderizarCarrinho() {
  const container = document.getElementById('carrinho-container');
  const carrinho = getCarrinho();
  
  if (!carrinho.length) {
    container.innerHTML = `
      <div class="carrinho-vazio">
        <i class="fa-solid fa-cart-shopping"></i>
        <h2>Carrinho Vazio</h2>
        <p>Adicione produtos para continuar</p>
        <a href="loja.html" class="btn">Explorar Produtos</a>
      </div>
    `;
    return;
  }
  
  let html = '';
  
  carrinho.forEach((item, index) => {
    html += `
      <div class="carrinho-item" data-key="${item.itemKey}">
        <div class="carrinho-item-img">
          ${item.imagem ? `<img src="imagens/produtos/${item.imagem}" alt="${item.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>'}
        </div>
        <div class="carrinho-item-info">
          <div class="carrinho-item-nome">${item.nome}</div>
          ${item.variante ? `<div class="carrinho-item-variante">${item.variante}</div>` : ''}
          <div class="carrinho-item-preco">${formatarKz(item.preco)}</div>
          <div class="carrinho-item-actions">
            <div class="qty-control">
              <button class="qty-btn" onclick="alterarQuantidade('${item.itemKey}', -1)">−</button>
              <span class="qty-val">${item.quantidade}</span>
              <button class="qty-btn" onclick="alterarQuantidade('${item.itemKey}', 1)">+</button>
            </div>
            <button class="btn-remover" onclick="removerItem('${item.itemKey}')">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>
    `;
  });
  
  const subtotal = getSubtotal();
  const desconto = getDesconto();
  const cupao = getCupao();
  const isGratis = subtotal >= 50000;
  const valorEntrega = isGratis ? 0 : 1500;
  const total = subtotal - desconto + valorEntrega;
  
  html += `
    <div class="resumo">
      <h3 class="resumo-titulo">Resumo da Compra</h3>
      <div class="resumo-linha">
        <span>Subtotal</span>
        <span>${formatarKz(subtotal)}</span>
      </div>
  `;
  
  if (desconto > 0) {
    html += `
      <div class="resumo-linha" style="color: var(--green);">
        <span>Desconto</span>
        <span>-${formatarKz(desconto)}</span>
      </div>
    `;
  }
  
  html += `
      <div class="resumo-linha">
        <span>Entrega ${isGratis ? '(Grátis)' : ''}</span>
        <span>${isGratis ? formatarKz(0) : formatarKz(valorEntrega)}</span>
      </div>
      <div class="resumo-linha total">
        <span>Total</span>
        <span>${formatarKz(total)}</span>
      </div>
    </div>
  `;
  
  if (!cupao) {
    html += `
      <div class="cupao-section">
        <input type="text" class="cupao-input" id="cupao-input" placeholder="Codigo do cupao">
        <button class="btn-cupao" onclick="aplicarCupao()">Aplicar</button>
      </div>
    `;
  } else {
    html += `
      <div class="cupao-aplicado">
        <span><i class="fa-solid fa-tag"></i> ${cupao.codigo} (${cupao.tipo === 'percentual' ? cupao.valor + '%' : formatarKz(cupao.valor)} off)</span>
        <button class="btn-remover-cupao" onclick="removerCupao()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    `;
  }
  
  html += `
    <button class="btn-finalizar" onclick="finalizarCompra()">
      <i class="fa-solid fa-check"></i> Finalizar Compra
    </button>
  `;
  
  container.innerHTML = html;
}

// ========== AÇÕES ==========
window.alterarQuantidade = function(itemKey, delta) {
  const carrinho = getCarrinho();
  const item = carrinho.find(i => i.itemKey === itemKey);
  if (!item) return;
  
  const novaQtd = item.quantidade + delta;
  if (novaQtd <= 0) {
    removerItem(itemKey);
    return;
  }
  
  item.quantidade = novaQtd;
  salvarCarrinho(carrinho);
  renderizarCarrinho();
};

window.removerItem = function(itemKey) {
  const carrinho = getCarrinho();
  const novoCarrinho = carrinho.filter(i => i.itemKey !== itemKey);
  salvarCarrinho(novoCarrinho);
  renderizarCarrinho();
  toast('Item removido do carrinho', 'ok');
};

window.aplicarCupao = function() {
  const input = document.getElementById('cupao-input');
  const codigo = input.value.trim().toUpperCase();
  
  if (!codigo) {
    toast('Digite um código de cupão', 'err');
    return;
  }
  
  // Cupões disponíveis
  const cupoes = [
    { codigo: 'BEMVINDO10', tipo: 'percentual', valor: 10 },
    { codigo: 'TECH20', tipo: 'percentual', valor: 20 },
    { codigo: 'FRETE50', tipo: 'fixo', valor: 5000 }
  ];
  
  const cupao = cupoes.find(c => c.codigo === codigo);
  
  if (!cupao) {
    toast('Cupão inválido', 'err');
    return;
  }
  
  salvarCupao(cupao);
  renderizarCarrinho();
  toast(`Cupão ${codigo} aplicado!`, 'ok');
};

window.removerCupao = function() {
  localStorage.removeItem('angophones_cupao');
  renderizarCarrinho();
  toast('Cupão removido', 'ok');
};

window.finalizarCompra = function() {
  const carrinho = getCarrinho();
  if (!carrinho.length) {
    toast('Carrinho vazio', 'err');
    return;
  }
  window.location.href = 'dados.html';
};

// Inicializar
renderizarCarrinho();
</script>
</body>
</html>
