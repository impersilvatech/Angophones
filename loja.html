<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#06060E">
  <meta name="description" content="Catalogo de produtos Angophones - Smartphones, tablets, acessorios e muito mais.">
  
  <title>Loja – Angophones</title>
  
  <!-- Favicon -->
  <link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Core CSS -->
  <link rel="stylesheet" href="core/css/core.css">
  <link rel="stylesheet" href="core/css/componentes.css">
  
  <!-- Tema Angophones -->
  <link rel="stylesheet" href="tema/css/tema.css">
  
  <style>
    /* ===== CABECALHO ===== */
    .cabecalho {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 85, 0, 0.1);
      background: rgba(6, 6, 14, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .cabecalho-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      text-transform: uppercase;
      text-decoration: none;
    }
    
    .logo span {
      color: var(--cor-primaria, #FF5500);
    }
    
    .tema-toggle {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .tema-toggle:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    /* ===== LOJA HEADER ===== */
    .loja-header {
      padding: 2rem 0 1rem;
    }
    
    .loja-header h1 {
      margin-bottom: 0.5rem;
    }
    
    /* ===== FILTROS ===== */
    .loja-filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    
    .pesquisa-wrapper {
      position: relative;
      flex: 1;
      min-width: 250px;
    }
    
    .pesquisa-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cor-texto-muted);
    }
    
    .pesquisa-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 100px;
      color: var(--cor-texto);
      font-size: 0.95rem;
    }
    
    .ordenacao-select {
      padding: 0.75rem 2rem 0.75rem 1rem;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 100px;
      color: var(--cor-texto);
      font-size: 0.95rem;
      cursor: pointer;
    }
    
    .filtros-categorias {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .filtro-categoria {
      padding: 0.5rem 1.25rem;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--cor-texto-suave);
    }
    
    .filtro-categoria:hover,
    .filtro-categoria.active {
      background: var(--cor-primaria);
      border-color: var(--cor-primaria);
      color: white;
    }
    
    .filtro-categoria i {
      margin-right: 0.25rem;
    }
    
    .resultados-info {
      margin-bottom: 1.5rem;
      color: var(--cor-texto-muted);
      font-size: 0.9rem;
    }
    
    /* ===== GRID DE PRODUTOS ===== */
    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    
    @media (min-width: 480px) {
      .produtos-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.25rem;
      }
    }
    
    @media (min-width: 768px) {
      .produtos-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
      }
    }
    
    .card-produto {
      background: var(--cor-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--cor-borda);
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    
    .card-produto:hover {
      transform: translateY(-4px);
      box-shadow: var(--sombra-md);
      border-color: var(--cor-primaria);
    }
    
    .card-produto-img {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--cor-fundo-alt);
      position: relative;
    }
    
    .card-produto-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    
    .card-produto:hover .card-produto-img img {
      transform: scale(1.05);
    }
    
    .card-produto .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
    }
    
    .badge-promo {
      background: #E8002D;
    }
    
    .badge-destaque {
      background: var(--cor-primaria);
    }
    
    .btn-wishlist {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 3;
    }
    
    .btn-wishlist:hover {
      background: var(--cor-primaria);
      transform: scale(1.1);
    }
    
    .btn-wishlist.ativo {
      color: #EF4444;
    }
    
    .card-produto-conteudo {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .card-produto-titulo {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--cor-texto);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-produto-descricao {
      font-size: 0.8rem;
      color: var(--cor-texto-muted);
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-produto-preco {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cor-primaria);
      margin-top: auto;
      margin-bottom: 0.75rem;
    }
    
    .card-produto-preco s {
      font-size: 0.8rem;
      color: var(--cor-texto-muted);
      margin-left: 0.5rem;
      font-weight: 400;
    }
    
    .card-produto-actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .btn-adicionar {
      flex: 1;
      padding: 0.6rem 0.5rem;
      background: var(--cor-primaria);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }
    
    .btn-adicionar:hover {
      filter: brightness(1.1);
    }
    
    .btn-quick-view {
      padding: 0.6rem;
      background: transparent;
      border: 1px solid var(--cor-borda);
      border-radius: 8px;
      color: var(--cor-texto);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-quick-view:hover {
      border-color: var(--cor-primaria);
      color: var(--cor-primaria);
    }
    
    /* ===== SEM RESULTADOS ===== */
    .sem-resultados {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--cor-card);
      border-radius: 16px;
      border: 1px solid var(--cor-borda);
    }
    
    .sem-resultados i {
      font-size: 3rem;
      color: var(--cor-texto-muted);
      margin-bottom: 1rem;
    }
    
    .sem-resultados h3 {
      margin-bottom: 0.5rem;
    }
    
    .sem-resultados p {
      color: var(--cor-texto-muted);
      margin-bottom: 1.5rem;
    }
    
    /* ===== PAGINACAO ===== */
    .paginacao {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
    }
    
    .paginacao-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 8px;
      color: var(--cor-texto);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .paginacao-btn:hover,
    .paginacao-btn.active {
      background: var(--cor-primaria);
      border-color: var(--cor-primaria);
      color: white;
    }
    
    .paginacao-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .paginacao-ellipsis {
      padding: 0 0.5rem;
      color: var(--cor-texto-muted);
      display: flex;
      align-items: center;
    }
    
    /* ===== BOTTOM NAVIGATION BAR ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(6, 6, 14, 0.98);
      border-top: 1px solid rgba(255, 85, 0, 0.1);
      backdrop-filter: blur(12px);
      z-index: 90;
      padding: 0.35rem 0;
      padding-bottom: max(0.35rem, env(safe-area-inset-bottom));
    }
    
    .bottom-nav .container {
      padding: 0 0.5rem;
    }
    
    .bottom-nav-menu {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.3rem 0.5rem;
      color: #A0A0A8;
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      border-radius: 8px;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }
    
    .bottom-nav-item i {
      font-size: 1.25rem;
      transition: transform 0.2s ease;
    }
    
    .bottom-nav-item:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.03);
    }
    
    .bottom-nav-item.active {
      color: var(--cor-primaria, #FF5500);
    }
    
    .bottom-nav-item .nav-badge {
      position: absolute;
      top: 0;
      right: 2px;
      background: var(--cor-primaria, #FF5500);
      color: white;
      border-radius: 100px;
      min-width: 16px;
      height: 16px;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border: 2px solid #06060E;
    }
    
    .bottom-nav-item .nav-badge.favoritos-badge {
      background: #EF4444;
    }
    
    /* ===== FAB WHATSAPP ===== */
    .fab-whatsapp {
      position: fixed;
      bottom: calc(75px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
      z-index: 95;
      transition: all 0.3s ease;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    
    .fab-whatsapp:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
    }
    
    /* ===== AJUSTES ===== */
    main {
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
    }
    
    @media (min-width: 769px) {
      .bottom-nav {
        display: none;
      }
      
      .fab-whatsapp {
        bottom: 30px;
        right: 30px;
      }
      
      main {
        padding-bottom: 0;
      }
    }
    
    .loading-placeholder {
      text-align: center;
      padding: 3rem;
      color: var(--cor-texto-muted);
      grid-column: 1 / -1;
    }
    
    .loading-placeholder i {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="container">
      <div class="cabecalho-inner">
        <a href="index.html" class="logo">
          Ango<span>phones</span>
        </a>
        
        <button class="tema-toggle" id="tema-toggle" aria-label="Alternar tema">
          <i class="fa-regular fa-sun"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Header da Loja -->
      <div class="loja-header">
        <h1>Catalogo de Produtos</h1>
        <p class="text-muted">Descubra os melhores smartphones e acessorios</p>
      </div>
      
      <!-- Filtros e Pesquisa -->
      <div class="loja-filtros">
        <div class="pesquisa-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="pesquisa-input" class="pesquisa-input" placeholder="Pesquisar produtos...">
        </div>
        
        <select id="ordenacao-select" class="ordenacao-select">
          <option value="destaque">Em Destaque</option>
          <option value="nome">Nome (A-Z)</option>
          <option value="preco-asc">Preco (Menor)</option>
          <option value="preco-desc">Preco (Maior)</option>
        </select>
      </div>
      
      <!-- Filtros por Categoria -->
      <div class="filtros-categorias" id="filtros-categorias">
        <button class="filtro-categoria active" data-categoria="todos">Todos</button>
      </div>
      
      <!-- Info de resultados -->
      <div class="resultados-info" id="resultados-info">
        <span id="resultados-contagem">0</span> produtos encontrados
      </div>
      
      <!-- Grid de Produtos -->
      <div class="produtos-grid" id="produtos-container">
        <div class="loading-placeholder">
          <i class="fa-solid fa-spinner"></i>
          <p>Carregando produtos...</p>
        </div>
      </div>
      
      <!-- Paginacao -->
      <div class="paginacao" id="paginacao-container"></div>
    </div>
  </main>

  <!-- FAB WhatsApp -->
  <a href="#" class="fab-whatsapp" id="fab-whatsapp" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <div class="container">
      <div class="bottom-nav-menu">
        <a href="index.html" class="bottom-nav-item">
          <i class="fa-solid fa-house"></i>
          <span>Inicio</span>
        </a>
        <a href="loja.html" class="bottom-nav-item active">
          <i class="fa-solid fa-mobile-screen"></i>
          <span>Loja</span>
        </a>
        <a href="carrinho.html" class="bottom-nav-item">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Carrinho</span>
          <span class="nav-badge" data-carrinho-contador style="display: none;">0</span>
        </a>
        <a href="favoritos.html" class="bottom-nav-item">
          <i class="fa-solid fa-heart"></i>
          <span>Favoritos</span>
          <span class="nav-badge favoritos-badge" data-favoritos-contador style="display: none;">0</span>
        </a>
        <a href="sobre.html" class="bottom-nav-item">
          <i class="fa-solid fa-circle-info"></i>
          <span>Sobre</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Core JavaScript -->
  <script src="core/js/loader.js"></script>
  <script src="core/js/utils.js"></script>
  <script src="core/js/core.js"></script>
  <script src="core/js/toast.js"></script>
  <script src="core/js/tema.js"></script>
  <script src="core/js/cart.js"></script>
  <script src="core/js/favoritos.js"></script>
  <script src="core/js/quick-view.js"></script>
  
  <!-- Script da Loja -->
  <script>
    (function() {
      console.log('=== LOJA.HTML CARREGADO ===');
      
      // Estado
      let produtosFiltrados = [];
      let categoriaAtual = 'todos';
      let ordenacaoAtual = 'destaque';
      let termoPesquisa = '';
      let paginaAtual = 1;
      const produtosPorPagina = 12;
      
      // Elementos
      const pesquisaInput = document.getElementById('pesquisa-input');
      const ordenacaoSelect = document.getElementById('ordenacao-select');
      const filtrosContainer = document.getElementById('filtros-categorias');
      const produtosContainer = document.getElementById('produtos-container');
      const resultadosContagem = document.getElementById('resultados-contagem');
      const paginacaoContainer = document.getElementById('paginacao-container');
      
      // Inicializar
      function inicializarLoja(catalogo) {
        console.log('Inicializando loja...');
        
        if (!catalogo) {
          console.error('Catalogo nao disponivel');
          return;
        }
        
        // Configurar FAB WhatsApp
        if (catalogo.loja && catalogo.loja.whatsapp) {
          const fab = document.getElementById('fab-whatsapp');
          if (fab) {
            const numero = catalogo.loja.whatsapp.replace(/\D/g, '');
            fab.href = `https://wa.me/${numero}?text=${encodeURIComponent('Ola! Gostaria de mais informacoes sobre os vossos produtos.')}`;
          }
        }
        
        // Verificar categoria na URL
        const urlParams = new URLSearchParams(window.location.search);
        const categoriaURL = urlParams.get('categoria');
        if (categoriaURL) {
          categoriaAtual = categoriaURL;
        }
        
        // Renderizar filtros de categoria
        if (catalogo.categorias) {
          catalogo.categorias.sort((a, b) => (a.ordem || 99) - (b.ordem || 99)).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `filtro-categoria ${categoriaAtual === cat.id ? 'active' : ''}`;
            btn.setAttribute('data-categoria', cat.id);
            btn.innerHTML = `<i class="fa-solid ${cat.icone || 'fa-mobile-screen'}"></i> ${cat.nome}`;
            btn.addEventListener('click', () => {
              document.querySelectorAll('.filtro-categoria').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              categoriaAtual = cat.id;
              paginaAtual = 1;
              filtrarEAtualizar();
            });
            filtrosContainer.appendChild(btn);
          });
        }
        
        // Botao "Todos"
        document.querySelector('[data-categoria="todos"]').addEventListener('click', () => {
          document.querySelectorAll('.filtro-categoria').forEach(b => b.classList.remove('active'));
          document.querySelector('[data-categoria="todos"]').classList.add('active');
          categoriaAtual = 'todos';
          paginaAtual = 1;
          filtrarEAtualizar();
        });
        
        // Event listeners
        pesquisaInput.addEventListener('input', () => {
          termoPesquisa = pesquisaInput.value;
          paginaAtual = 1;
          filtrarEAtualizar();
        });
        
        ordenacaoSelect.addEventListener('change', () => {
          ordenacaoAtual = ordenacaoSelect.value;
          paginaAtual = 1;
          filtrarEAtualizar();
        });
        
        filtrarEAtualizar();
      }
      
      function filtrarEAtualizar() {
        const catalogo = window.CATALOGO;
        if (!catalogo || !catalogo.produtos) return;
        
        // Filtrar por categoria
        let produtos = categoriaAtual === 'todos' 
          ? [...catalogo.produtos]
          : catalogo.produtos.filter(p => p.categoria === categoriaAtual);
        
        // Filtrar por pesquisa
        if (termoPesquisa) {
          const termo = termoPesquisa.toLowerCase();
          produtos = produtos.filter(p => 
            p.nome.toLowerCase().includes(termo) || 
            (p.descricao || '').toLowerCase().includes(termo)
          );
        }
        
        // Ordenar
        produtos = ordenarProdutos(produtos, ordenacaoAtual);
        
        produtosFiltrados = produtos;
        resultadosContagem.textContent = produtos.length;
        
        renderizarProdutosPaginados();
        renderizarPaginacao();
      }
      
      function ordenarProdutos(produtos, ordenacao) {
        const copia = [...produtos];
        switch (ordenacao) {
          case 'nome':
            return copia.sort((a, b) => a.nome.localeCompare(b.nome));
          case 'preco-asc':
            return copia.sort((a, b) => (a.precoPromocional || a.preco) - (b.precoPromocional || b.preco));
          case 'preco-desc':
            return copia.sort((a, b) => (b.precoPromocional || b.preco) - (a.precoPromocional || a.preco));
          default:
            return copia.sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0));
        }
      }
      
      function renderizarProdutosPaginados() {
        const inicio = (paginaAtual - 1) * produtosPorPagina;
        const fim = inicio + produtosPorPagina;
        const produtosPagina = produtosFiltrados.slice(inicio, fim);
        
        if (produtosPagina.length === 0) {
          produtosContainer.innerHTML = `
            <div class="sem-resultados">
              <i class="fa-regular fa-face-frown"></i>
              <h3>Nenhum produto encontrado</h3>
              <p>Tente ajustar os filtros ou pesquisar por outro termo.</p>
              <button class="btn" onclick="document.getElementById('pesquisa-input').value=''; termoPesquisa=''; filtrarEAtualizar();">
                Limpar Pesquisa
              </button>
            </div>
          `;
          return;
        }
        
        produtosContainer.innerHTML = '';
        produtosPagina.forEach(produto => {
          produtosContainer.appendChild(criarCardProduto(produto));
        });
      }
      
      function criarCardProduto(produto) {
        const card = document.createElement('div');
        card.className = 'card-produto';
        
        const preco = produto.precoPromocional || produto.preco;
        const precoOriginal = produto.emPromocao ? produto.preco : null;
        
        card.innerHTML = `
          <div class="card-produto-img">
            <img src="imagens/produtos/${produto.imagens?.[0] || 'placeholder.png'}" alt="${produto.nome}" onerror="this.src='core/assets/placeholder.png'">
            ${produto.emPromocao ? '<span class="badge badge-promo">Promo</span>' : ''}
            ${produto.destaque ? '<span class="badge badge-destaque">Destaque</span>' : ''}
            <button class="btn-wishlist" data-produto-id="${produto.id}">
              <i class="fa-regular fa-heart"></i>
            </button>
          </div>
          <div class="card-produto-conteudo">
            <h3 class="card-produto-titulo">${produto.nome}</h3>
            <p class="card-produto-descricao">${produto.descricao || ''}</p>
            <div class="card-produto-preco">
              ${formatarKz(preco)}
              ${precoOriginal ? `<s>${formatarKz(precoOriginal)}</s>` : ''}
            </div>
            <div class="card-produto-actions">
              <button class="btn-adicionar" data-produto-id="${produto.id}">
                <i class="fa-solid fa-cart-shopping"></i> Adicionar
              </button>
              <button class="btn-quick-view" data-produto-id="${produto.id}" title="Ver rapido">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
        `;
        
        // Event listeners
        card.querySelector('.btn-adicionar').addEventListener('click', (e) => {
          e.stopPropagation();
          if (window.cart) {
            window.cart.adicionarAoCarrinho(produto, 1);
          }
        });
        
        card.querySelector('.btn-quick-view').addEventListener('click', (e) => {
          e.stopPropagation();
          if (window.quickView) {
            window.quickView.abrirModal(produto.id);
          }
        });
        
        const wishlistBtn = card.querySelector('.btn-wishlist');
        wishlistBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (window.favoritos) {
            const isFavorito = window.favoritos.alternarFavorito(produto);
            const icon = wishlistBtn.querySelector('i');
            icon.className = isFavorito ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
            wishlistBtn.classList.toggle('ativo', isFavorito);
          }
        });
        
        // Verificar favoritos
        if (window.favoritos && window.favoritos.estaNosFavoritos(produto.id)) {
          wishlistBtn.querySelector('i').className = 'fa-solid fa-heart';
          wishlistBtn.classList.add('ativo');
        }
        
        card.addEventListener('click', () => {
          window.location.href = `produto.html?id=${produto.id}`;
        });
        
        return card;
      }
      
      function formatarKz(valor) {
        return valor.toLocaleString('pt-AO', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + ' Kz';
      }
      
      function renderizarPaginacao() {
        const totalPaginas = Math.ceil(produtosFiltrados.length / produtosPorPagina);
        
        if (totalPaginas <= 1) {
          paginacaoContainer.innerHTML = '';
          return;
        }
        
        let html = '';
        
        html += `<button class="paginacao-btn" ${paginaAtual === 1 ? 'disabled' : ''} data-page="prev">
          <i class="fa-solid fa-chevron-left"></i>
        </button>`;
        
        for (let i = 1; i <= totalPaginas; i++) {
          if (i === 1 || i === totalPaginas || (i >= paginaAtual - 2 && i <= paginaAtual + 2)) {
            html += `<button class="paginacao-btn ${i === paginaAtual ? 'active' : ''}" data-page="${i}">${i}</button>`;
          } else if (i === paginaAtual - 3 || i === paginaAtual + 3) {
            html += `<span class="paginacao-ellipsis">...</span>`;
          }
        }
        
        html += `<button class="paginacao-btn" ${paginaAtual === totalPaginas ? 'disabled' : ''} data-page="next">
          <i class="fa-solid fa-chevron-right"></i>
        </button>`;
        
        paginacaoContainer.innerHTML = html;
        
        paginacaoContainer.querySelectorAll('[data-page]').forEach(btn => {
          btn.addEventListener('click', () => {
            const page = btn.dataset.page;
            if (page === 'prev' && paginaAtual > 1) {
              paginaAtual--;
            } else if (page === 'next' && paginaAtual < totalPaginas) {
              paginaAtual++;
            } else if (!isNaN(page)) {
              paginaAtual = parseInt(page);
            }
            
            renderizarProdutosPaginados();
            renderizarPaginacao();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }
      
      // Aguardar catalogo
      if (window.CATALOGO) {
        inicializarLoja(window.CATALOGO);
      } else {
        window.addEventListener('catalogoCarregado', (e) => inicializarLoja(e.detail));
      }
      
      setTimeout(() => {
        if (window.CATALOGO) inicializarLoja(window.CATALOGO);
      }, 2000);
    })();
  </script>
  
  <!-- Script para toggle de tema -->
  <script>
    (function() {
      const temaToggle = document.getElementById('tema-toggle');
      if (!temaToggle) return;
      
      function inicializarTemaToggle() {
        if (!window.tema) {
          setTimeout(inicializarTemaToggle, 100);
          return;
        }
        
        const atualizarIcone = () => {
          const temaAtual = window.tema.getTema();
          const icon = temaToggle.querySelector('i');
          if (icon) {
            icon.className = temaAtual === 'escuro' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
          }
        };
        
        atualizarIcone();
        temaToggle.addEventListener('click', () => {
          window.tema.alternarTema();
          atualizarIcone();
        });
      }
      
      inicializarTemaToggle();
    })();
  </script>
</body>
</html>
