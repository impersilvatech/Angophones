<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --red: #EF4444;
  --green: #22C55E;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
}
[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 80px;
  transition: background 0.3s, color 0.3s;
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }
.hdr-nome {
  font-family: var(--ft);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  color: var(--white);
}
.hdr-nome span { color: var(--primary); }
.hb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.search-wrap {
  position: relative;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
}
.si {
  width: 100%;
  padding: 12px 16px 12px 42px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 30px;
  font-family: var(--fb);
  font-size: 0.9rem;
  color: var(--white);
  outline: none;
}
.si::placeholder { color: var(--muted2); }
.si-ico {
  position: absolute;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 0.9rem;
}
.cats {
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 0;
}
.cats::-webkit-scrollbar { display: none; }
.cats-inner {
  display: flex;
  padding: 0 16px;
  gap: 8px;
  width: max-content;
}
.cat-btn {
  padding: 8px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 30px;
  font-family: var(--ft);
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  text-transform: uppercase;
  transition: all 0.2s;
}
.cat-btn.on {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.cat-btn i { margin-right: 4px; }
.result-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  font-size: 0.75rem;
  color: var(--muted);
}
.result-bar strong { color: var(--white); }
.wl-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 6px 12px;
  font-size: 0.65rem;
  color: var(--muted);
  cursor: pointer;
}
.wl-toggle.on {
  color: var(--primary);
  border-color: var(--primary);
  background: rgba(255, 85, 0, 0.05);
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 8px 12px;
}
.pcard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.pcard.esgotado { opacity: 0.5; cursor: not-allowed; }
.pcard.esgotado::after {
  content: 'Esgotado';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 85, 0, 0.1);
  border-top: 1px solid rgba(255, 85, 0, 0.3);
  text-align: center;
  font-family: var(--ft);
  font-size: 0.55rem;
  color: var(--primary);
  padding: 4px 0;
  text-transform: uppercase;
}
.pcard:not(.esgotado):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(255, 85, 0, 0.1);
  border-color: rgba(255, 85, 0, 0.3);
}
.pcard-img {
  aspect-ratio: 1;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  border-radius: 14px 14px 0 0;
}
.pcard-img img { width: 100%; height: 100%; object-fit: cover; }
.pcard-img i { font-size: 2.5rem; color: var(--muted2); opacity: 0.5; }
.ptag {

  top: 8px;
  left: 8px;
  padding: 3px 8px;
  font-family: var(--ft);
  font-size: 0.5rem;
  letter-spacing: 0.05em;
  border-radius: 6px;
  text-transform: uppercase;
  z-index: 2;
}
.ptag-promo { background: var(--red); color: white; }
.ptag-destaque { background: var(--grad); color: white; }
.btn-wish {

  height: 28px;
  border-radius: 50%;
  background: rgba(6, 6, 14, 0.7);

  border: 1px solid rgba(255, 255, 255, 0.1);

  align-items: center;
  justify-content: center;
  font-size: 0.8rem;

}
.btn-wish.on { color: var(--primary); }
.pcard-body { padding: 10px 10px 12px; }
.pcard-cat {
  font-size: 0.5rem;
  font-weight: 600;

  opacity: 0.8;

}
.pcard-nome {

.pcard-preco {

.pcard-val {

.pcard-orig {

.btn-add-quick {

  right: 8px;

.empty { padding: 60px 20px; text-align: center; display: none; }
.empty i { font-size: 3rem; margin-bottom: 12px; opacity: 0.2; }

.overlay {

.sheet {

.sh-bar { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 0; }

.sh-img {

.qty-row { display: flex; align-items: center; }
.qty-btn {

.sh-btns { display: flex; gap: 8px; margin-top: 14px; }

.bottom-nav {

  right: 0;

.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);

.toast.show {
  transform: translateX(-50%) translateY(0);

}
@media (min-width: 1024px) {

<script>
// ========== TEMA ==========
function alternarTema() {
  const html = document.documentElement;
  const icon = document.querySelector('[data-theme-ico]');
  const temaAtual = html.getAttribute('data-theme') || 'dark';
  const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', novoTema);
  localStorage.setItem('tema', novoTema);
  if (icon) icon.className = novoTema === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#06060E' : '#F5F5F7');
}
(function() {
  const temaSalvo = localStorage.getItem('tema') || 'dark';
  document.documentElement.setAttribute('data-theme', temaSalvo);
  const icon = document.querySelector('[data-theme-ico]');
  if (icon) icon.className = temaSalvo === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
})();

  { id: 4, nome: 'AirPods Pro 2ª Geração', categoria: 'acessorios', descricao: 'Cancelamento de ruído adaptativo.', preco: 185000, precoPromocional: 169999, emPromocao: true, imagens: [], stock: 15, destaque: true },
  { id: 5, nome: 'Power Bank 20000mAh', categoria: 'acessorios', descricao: 'Carregamento rápido para até 3 dispositivos.', preco: 25000, imagens: [], stock: 20 },
  { id: 6, nome: 'Capa Transparente iPhone 15', categoria: 'capas', descricao: 'Proteção fina e resistente.', preco: 8500, imagens: [], stock: 30 },

function getFavoritos() { return JSON.parse(localStorage.getItem('angophones_favoritos') || '[]'); }
function salvarFavoritos(f) { localStorage.setItem('angophones_favoritos', JSON.stringify(f)); }

function formatarKz(v) {

  t.textContent = msg;
  t.className = 'toast show';
  t.style.borderLeftColor = tipo === 'err' ? '#EF4444' : '#FF5500';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ========== INICIALIZAR ==========
function buildCategorias() {
  const catsInner = document.getElementById('cats-inner');
  catsInner.innerHTML = '<button class="cat-btn on" onclick="filtrarCategoria(\'\')">TODOS</button>';
  CATEGORIAS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<i class="fa-solid ${cat.icone}"></i> ${cat.nome}`;
    btn.onclick = () => filtrarCategoria(cat.id);
    catsInner.appendChild(btn);
  });
}

function filtrarCategoria(catId) {
  document.querySelectorAll('.cat-btn').forEach((b, i) => b.classList.toggle('on', i === 0 ? !catId : b.textContent.includes(CATEGORIAS.find(c => c.id === catId)?.nome)));
  categoriaAtual = catId;
  wlMode = false;
  document.getElementById('wl-toggle-btn').classList.remove('on');
  render();
}

function toggleWlView() {
  wlMode = !wlMode;
  document.getElementById('wl-toggle-btn').classList.toggle('on', wlMode);
  render();
}

function render() {
  let lista = [...PRODUTOS];
  const favoritos = getFavoritos();
  
  if (wlMode) {
    lista = lista.filter(p => favoritos.some(f => f.id === p.id));
  } else {
    if (categoriaAtual) lista = lista.filter(p => p.categoria === categoriaAtual);
    if (termoPesquisa) lista = lista.filter(p => p.nome.toLowerCase().includes(termoPesquisa) || p.descricao?.toLowerCase().includes(termoPesquisa));
  }
  
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const resultTxt = document.getElementById('result-txt');
  
  if (!lista.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    resultTxt.innerHTML = '<strong>0</strong> produtos';
    return;
  }
  
  empty.style.display = 'none';
  resultTxt.innerHTML = `<strong>${lista.length}</strong> produto${lista.length !== 1 ? 's' : ''}`;
  
  grid.innerHTML = lista.map(p => {
    const preco = p.precoPromocional || p.preco;
    const precoOrig = p.emPromocao ? p.preco : null;
    const pct = precoOrig ? Math.round((1 - preco / precoOrig) * 100) : 0;
    const tag = p.emPromocao ? 'promo' : (p.destaque ? 'destaque' : '');
    const tagLabel = { promo: `-${pct}%`, destaque: 'DESTAQUE' }[tag] || '';
    const esgotado = p.stock === 0;
    const wished = favoritos.some(f => f.id === p.id);
    
    return `<div class="pcard ${esgotado ? 'esgotado' : ''}" onclick="openSheet(${p.id})">
      <div class="pcard-img">
        ${p.imagens?.[0] ? `<img src="imagens/produtos/${p.imagens[0]}" alt="${p.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>'}
        ${tag ? `<span class="ptag ptag-${tag}">${tagLabel}</span>` : ''}
        <button class="btn-wish ${wished ? 'on' : ''}" onclick="event.stopPropagation(); toggleWishlist(${p.id}, this)">
          <i class="fa-${wished ? 'solid' : 'regular'} fa-heart"></i>
        </button>
      </div>
      <div class="pcard-body">
        <div class="pcard-cat">${CATEGORIAS.find(c => c.id === p.categoria)?.nome || ''}</div>
        <div class="pcard-nome">${p.nome}</div>
        <div class="pcard-preco">
          <span class="pcard-val">${formatarKz(preco)}</span>
          ${precoOrig ? `<span class="pcard-orig">${formatarKz(precoOrig)}</span><span class="pcard-pct">-${pct}%</span>` : ''}
        </div>
      </div>
      ${!esgotado ? `<button class="btn-add-quick" onclick="event.stopPropagation(); addDireto(${p.id})"><i class="fa-solid fa-plus"></i></button>` : ''}
    </div>`;
  }).join('');
}

// ========== AÇÕES ==========
window.toggleWishlist = function(id, btn) {
  const produto = PRODUTOS.find(p => p.id === id);
  if (!produto) return;
  const favoritos = getFavoritos();
  const index = favoritos.findIndex(f => f.id === id);
  if (index === -1) favoritos.push({ id, nome: produto.nome, preco: produto.precoPromocional || produto.preco });
  else favoritos.splice(index, 1);
  salvarFavoritos(favoritos);
  render();
  toast(index === -1 ? 'Adicionado aos favoritos' : 'Removido dos favoritos', 'ok');
};

window.openSheet = function(id) {
  const p = PRODUTOS.find(x => x.id === id);
  if (!p || p.stock === 0) { toast('Produto esgotado', 'err'); return; }
  produtoSheet = p;
  qtySheet = 1;
  document.getElementById('sh-img').innerHTML = p.imagens?.[0] ? `<img src="imagens/produtos/${p.imagens[0]}" alt="${p.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>';
  document.getElementById('sh-cat').textContent = CATEGORIAS.find(c => c.id === p.categoria)?.nome || '';
  document.getElementById('sh-nome').textContent = p.nome;
  const preco = p.precoPromocional || p.preco;
  document.getElementById('sh-preco').textContent = formatarKz(preco);
  const origEl = document.getElementById('sh-orig'), pctEl = document.getElementById('sh-pct');
  if (p.emPromocao && p.preco) {
    origEl.textContent = formatarKz(p.preco);
    origEl.style.display = 'inline';
    pctEl.textContent = `-${Math.round((1 - preco / p.preco) * 100)}%`;
    pctEl.style.display = 'inline';
  } else { origEl.style.display = 'none'; pctEl.style.display = 'none'; }
  document.getElementById('sh-desc').textContent = p.descricao || '';
  document.getElementById('qty-val').textContent = '1';
  document.getElementById('btn-sh-add').innerHTML = `<i class="fa-solid fa-cart-shopping" style="margin-right:5px"></i>Adicionar — ${formatarKz(preco)}`;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
};

window.fecharSheet = function() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  document.body.style.overflow = '';
  produtoSheet = null;
};

window.qty = function(d) {
  qtySheet = Math.max(1, Math.min(99, qtySheet + d));
  document.getElementById('qty-val').textContent = qtySheet;
  if (produtoSheet) {
    const preco = produtoSheet.precoPromocional || produtoSheet.preco;
    document.getElementById('btn-sh-add').innerHTML = `<i class="fa-solid fa-cart-shopping" style="margin-right:5px"></i>Adicionar — ${formatarKz(preco * qtySheet)}`;
  }
};

window.addCart = function() {
  if (!produtoSheet) return;
  const carrinho = getCarrinho();
  const preco = produtoSheet.precoPromocional || produtoSheet.preco;
  const itemKey = `${produtoSheet.id}_padrao_padrao`;
  const existente = carrinho.find(i => i.itemKey === itemKey);
  if (existente) existente.quantidade += qtySheet;
  else carrinho.push({ itemKey, id: produtoSheet.id, nome: produtoSheet.nome, preco, imagem: produtoSheet.imagens?.[0] || '', quantidade: qtySheet, variante: null });
  salvarCarrinho(carrinho);
  fecharSheet();
  toast(`${produtoSheet.nome} adicionado ao carrinho`, 'ok');
};

window.addDireto = function(id) {
  const p = PRODUTOS.find(x => x.id === id);
  if (!p || p.stock === 0) { toast('Produto esgotado', 'err'); return; }
  const carrinho = getCarrinho();
  const preco = p.precoPromocional || p.preco;
  const itemKey = `${p.id}_padrao_padrao`;
  const existente = carrinho.find(i => i.itemKey === itemKey);
  if (existente) existente.quantidade += 1;
  else carrinho.push({ itemKey, id: p.id, nome: p.nome, preco, imagem: p.imagens?.[0] || '', quantidade: 1, variante: null });
  salvarCarrinho(carrinho);
  toast(`${p.nome} adicionado ao carrinho`, 'ok');
};

window.irDetalhe = function() {
  if (produtoSheet) {
    fecharSheet();
    window.location.href = `produto.html?id=${produtoSheet.id}`;
  }
};

// ========== EVENTOS ==========
document.getElementById('si').addEventListener('input', function() {
  termoPesquisa = this.value.trim().toLowerCase();
  render();
});

buildCategorias();
render();
</script>
</body>
</html>
