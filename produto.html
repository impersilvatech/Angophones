<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#06060E">
<title>Produto | Angophones</title>
<link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --primary-hover: #FF7A33;
  --red: #EF4444;
  --green: #22C55E;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
  --tr: all 0.2s ease;
}

[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 72px;
  transition: background 0.3s, color 0.3s;
}

/* Header */
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.3s;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }

.btn-bk {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  cursor: pointer;
  color: var(--white);
  flex-shrink: 0;
}

.hdr-titulo {
  font-family: var(--ft);
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-th {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  cursor: pointer;
  flex-shrink: 0;
  color: var(--white);
}

/* Hero / Carrossel */
.prod-hero {
  width: 100%;
  aspect-ratio: 1;
  max-height: 400px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.prod-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.prod-emoji-big {
  font-size: 6rem;
  color: var(--muted2);
  opacity: 0.5;
}

.carousel {
  width: 100%;
  aspect-ratio: 1;
  max-height: 400px;
  overflow: hidden;
  position: relative;
  background: var(--bg2);
}
.carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.carousel-slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--bg2);
}
.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.carousel-slide i {
  font-size: 6rem;
  color: var(--muted2);
  opacity: 0.5;
}
.carousel-dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 10;
}
.carousel-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  transition: all 0.2s;
}
.carousel-dot.on {
  background: var(--primary);
  width: 18px;
  border-radius: 3px;
}
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(6, 6, 14, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }

.tag-strip {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px;
  z-index: 5;
}
.prod-tag {
  padding: 4px 12px;
  font-family: var(--ft);
  font-size: 0.6rem;
  letter-spacing: 0.05em;
  border-radius: 50px;
  text-transform: uppercase;
}
.prod-tag.promo { background: var(--red); color: white; }
.prod-tag.novo { background: var(--green); color: white; }
.prod-tag.destaque { background: var(--grad); color: white; }
.btn-zoom {
  padding: 7px 14px;
  background: rgba(6, 6, 14, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.6rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

/* Detalhes */
.pd {
  padding: 18px 16px 8px;
}
.pd-cat {
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--primary);
  opacity: 0.8;
  margin-bottom: 3px;
}
.pd-nome {
  font-family: var(--ft);
  font-size: 1.8rem;
  letter-spacing: 0.02em;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 8px;
}
.pd-preco {
  font-family: var(--ft);
  font-size: 1.5rem;
  color: var(--primary);
  margin-bottom: 5px;
}
.pd-orig-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.pd-orig {
  font-size: 0.9rem;
  color: var(--muted2);
  text-decoration: line-through;
}
.pd-pct {
  padding: 2px 8px;
  background: var(--red);
  color: white;
  font-family: var(--ft);
  font-size: 0.65rem;
  border-radius: 6px;
}
.pd-desc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 10px;
}
.pd-dests {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.pd-dest-it {
  padding: 4px 10px;
  background: rgba(255, 85, 0, 0.08);
  border: 1px solid rgba(255, 85, 0, 0.2);
  border-radius: 50px;
  font-size: 0.7rem;
  color: var(--primary);
}

.divd {
  height: 1px;
  background: var(--border);
  margin: 14px 16px;
}

/* Secções */
.sec {
  padding: 0 16px;
  margin-bottom: 16px;
}
.sec-t {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.qty-row {
  display: flex;
  align-items: center;
}
.qty-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: none;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--white);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-btn:hover { background: var(--primary); border-color: var(--primary); }
.qty-val {
  min-width: 50px;
  text-align: center;
  font-family: var(--ft);
  font-size: 1.2rem;
  color: var(--white);
}

/* Especificações */
.specs-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.spec-row {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.spec-row:last-child { border-bottom: none; }
.spec-k {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted);
  min-width: 100px;
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
.spec-v {
  font-size: 0.85rem;
  color: var(--white);
  line-height: 1.4;
}

/* Produtos relacionados */
.related-scroll {
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 2px 16px 6px;
}
.related-scroll::-webkit-scrollbar { display: none; }
.related-inner {
  display: flex;
  gap: 10px;
  width: max-content;
}
.rcard {
  width: 120px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: var(--tr);
  flex-shrink: 0;
}
.rcard:hover {
  border-color: rgba(255, 85, 0, 0.35);
  transform: translateY(-2px);
}
.rcard-img {
  width: 100%;
  height: 100px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.rcard-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.rcard-img i {
  font-size: 2.5rem;
  color: var(--muted2);
  opacity: 0.5;
}
.rcard-body {
  padding: 8px 9px 10px;
}
.rcard-nome {
  font-family: var(--ft);
  font-size: 0.8rem;
  letter-spacing: 0.02em;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 3px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.rcard-preco {
  font-family: var(--ft);
  font-size: 0.8rem;
  color: var(--primary);
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 600;
  background: rgba(0, 0, 0, 0.97);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox.on { display: flex; }
.lb-img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 14px;
}
.lb-emoji {
  font-size: 8rem;
  color: var(--muted2);
  opacity: 0.5;
}
.lb-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: none;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: 8px 12px 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
}
[data-theme="light"] .bottom-nav { background: rgba(245, 245, 247, 0.97); }

.btn-cart-ico {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  text-decoration: none;
}
.badge-n {
  position: absolute;
  top: -3px;
  right: -3px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  min-width: 16px;
  height: 16px;
  font-size: 0.5rem;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
}
.badge-n.on { display: flex; }

.btn-add-nav {
  flex: 1;
  height: 44px;
  border: none;
  border-radius: 50px;
  background: var(--grad);
  font-family: var(--ft);
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  transition: var(--tr);
  box-shadow: 0 4px 14px rgba(255, 85, 0, 0.3);
}
.btn-add-nav:hover { filter: brightness(1.1); }

/* FAB WhatsApp */
.fab-whatsapp {
  position: fixed;
  bottom: 95px;
  right: 16px;
  width: 50px;
  height: 50px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.75rem;
  box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
  z-index: 150;
  text-decoration: none;
}

/* Toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 18px;
  font-size: 0.85rem;
  font-weight: 500;
  text-align: center;
  max-width: calc(100vw - 32px);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.toast.ok { border-color: var(--primary); color: var(--primary); }
.toast.err { border-color: var(--red); color: var(--red); }

@media (min-width: 769px) {
  .bottom-nav { display: none; }
  body { padding-bottom: 0; }
  .fab-whatsapp { bottom: 24px; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
.anim { animation: fadeUp 0.35s ease both; }
</style>
</head>
<body>

<header class="hdr">
  <button class="btn-bk" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="hdr-titulo" id="hdr-titulo">Produto</div>
  <button class="btn-th" id="btn-wl" onclick="toggleWl()"><i class="fa-regular fa-heart"></i></button>
  <button class="btn-th" onclick="toggleTheme()"><i data-theme-ico class="fa-regular fa-sun"></i></button>
</header>

<div id="hero-container"></div>

<div class="pd anim">
  <div class="pd-cat" id="pd-cat"></div>
  <div class="pd-nome" id="pd-nome">—</div>
  <div class="pd-preco" id="pd-preco"></div>
  <div class="pd-orig-row" id="pd-orig-row" style="display:none">
    <span class="pd-orig" id="pd-orig"></span>
    <span class="pd-pct" id="pd-pct"></span>
  </div>
  <p class="pd-desc" id="pd-desc"></p>
  <div class="pd-dests" id="pd-dests"></div>
</div>

<div class="divd"></div>

<div class="sec" id="sec-qty">
  <div class="sec-t">Quantidade</div>
  <div class="qty-row">
    <button class="qty-btn" onclick="qty(-1)">−</button>
    <span class="qty-val" id="qty-val">1</span>
    <button class="qty-btn" onclick="qty(1)">+</button>
  </div>
</div>

<div class="divd"></div>

<div class="sec" id="sec-specs" style="display:none">
  <div class="sec-t">Especificacoes</div>
  <div class="specs-card" id="specs-card"></div>
</div>

<div class="divd" id="rel-div" style="display:none"></div>

<div class="sec" id="sec-rel" style="display:none">
  <div class="sec-t">Veja tambem</div>
  <div class="related-scroll">
    <div class="related-inner" id="rel-inner"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
  <button class="lb-close"><i class="fa-solid fa-xmark"></i></button>
  <img class="lb-img" id="lb-img" src="" alt="" style="display:none">
  <i class="lb-emoji" id="lb-emoji" style="display:none"></i>
</div>

<a href="#" class="fab-whatsapp" id="fab-whatsapp" target="_blank">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<nav class="bottom-nav">
  <a href="carrinho.html" class="btn-cart-ico">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="badge-n" id="badge-n">0</span>
  </a>
  <button class="btn-add-nav" id="btn-add" onclick="addCart()">Adicionar ao Carrinho</button>
</nav>

<div class="toast" id="toast"></div>

<script src="core/js/loader.js"></script>
<script src="core/js/utils.js"></script>
<script src="core/js/core.js"></script>
<script src="core/js/toast.js"></script>
<script src="core/js/tema.js"></script>
<script src="core/js/cart.js"></script>
<script src="core/js/favoritos.js"></script>

<script>
(function(){
  let produto = null;
  let qty = 1;
  let carouselIdx = 0;
  let carouselImgs = [];
  
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    
    if (!id) { window.location.href = 'loja.html'; return; }
    
    function init(data) {
      const catalogo = data;
      if (!catalogo) return;
      
      produto = catalogo.produtos?.find(p => p.id == id);
      if (!produto) { window.location.href = 'loja.html'; return; }
      
      carregarProduto(catalogo);
      atualizarBadgeCarrinho();
      atualizarBotaoWishlist();
      
      const fab = document.getElementById('fab-whatsapp');
      if (fab && catalogo.loja?.whatsapp) {
        fab.href = `https://wa.me/${catalogo.loja.whatsapp.replace(/\D/g, '')}?text=Ola!%20Gostaria%20de%20informacoes%20sobre%20${encodeURIComponent(produto.nome)}.`;
      }
    }
    
    if (window.CATALOGO) init(window.CATALOGO);
    else window.addEventListener('catalogoCarregado', e => init(e.detail));
    setTimeout(() => { if (window.CATALOGO) init(window.CATALOGO); }, 1500);
  });
  
  function carregarProduto(catalogo) {
    document.title = `${produto.nome} | Angophones`;
    document.getElementById('hdr-titulo').textContent = produto.nome;
    
    carouselImgs = [];
    if (produto.imagens?.[0]) carouselImgs.push(produto.imagens[0]);
    if (produto.imagens?.length > 1) carouselImgs.push(...produto.imagens.slice(1));
    
    const heroContainer = document.getElementById('hero-container');
    const tag = produto.emPromocao ? 'promo' : (produto.destaque ? 'destaque' : '');
    const tagLabel = { promo: 'PROMO', destaque: 'DESTAQUE' }[tag] || '';
    
    if (carouselImgs.length > 1) {
      const slides = carouselImgs.map((img, i) => `
        <div class="carousel-slide">
          <img src="imagens/produtos/${img}" alt="${produto.nome}" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-mobile-screen\'></i>'">
        </div>
      `).join('');
      
      const dots = carouselImgs.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'on' : ''}" onclick="goSlide(${i})"></div>`).join('');
      
      heroContainer.innerHTML = `
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carousel-track">${slides}</div>
          <button class="carousel-btn prev" onclick="goSlide(carouselIdx - 1)"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="carousel-btn next" onclick="goSlide(carouselIdx + 1)"><i class="fa-solid fa-chevron-right"></i></button>
          <div class="carousel-dots">${dots}</div>
          <div class="tag-strip">
            ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
            <button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button>
          </div>
        </div>
      `;
    } else if (carouselImgs.length === 1) {
      heroContainer.innerHTML = `
        <div class="prod-hero">
          <img src="imagens/produtos/${carouselImgs[0]}" alt="${produto.nome}" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-mobile-screen prod-emoji-big\'></i>'">
          <div class="tag-strip">
            ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
            <button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button>
          </div>
        </div>
      `;
    } else {
      heroContainer.innerHTML = `
        <div class="prod-hero">
          <i class="fa-solid fa-mobile-screen prod-emoji-big"></i>
          <div class="tag-strip">
            ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
          </div>
        </div>
      `;
    }
    
    const catMap = {};
    if (catalogo.categorias) catalogo.categorias.forEach(c => catMap[c.id] = c.nome);
    
    document.getElementById('pd-cat').textContent = catMap[produto.categoria] || '';
    document.getElementById('pd-nome').textContent = produto.nome;
    
    const preco = produto.precoPromocional || produto.preco;
    document.getElementById('pd-preco').textContent = formatarKz(preco);
    
    if (produto.emPromocao && produto.preco) {
      document.getElementById('pd-orig').textContent = formatarKz(produto.preco);
      document.getElementById('pd-pct').textContent = `-${Math.round((1 - preco / produto.preco) * 100)}%`;
      document.getElementById('pd-orig-row').style.display = 'flex';
    }
    
    document.getElementById('pd-desc').textContent = produto.descricao || 'Sem descricao disponivel.';
    
    if (produto.especificacoes && Object.keys(produto.especificacoes).length) {
      document.getElementById('sec-specs').style.display = 'block';
      document.getElementById('specs-card').innerHTML = Object.entries(produto.especificacoes)
        .map(([k, v]) => `<div class="spec-row"><span class="spec-k">${k}</span><span class="spec-v">${v}</span></div>`).join('');
    }
    
    const relacionados = catalogo.produtos?.filter(p => p.categoria === produto.categoria && p.id !== produto.id).slice(0, 6) || [];
    if (relacionados.length) {
      document.getElementById('sec-rel').style.display = 'block';
      document.getElementById('rel-div').style.display = 'block';
      document.getElementById('rel-inner').innerHTML = relacionados.map(r => {
        const rPreco = r.precoPromocional || r.preco;
        return `
          <div class="rcard" onclick="window.location.href='produto.html?id=${r.id}'">
            <div class="rcard-img">
              ${r.imagens?.[0] ? `<img src="imagens/produtos/${r.imagens[0]}" alt="${r.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>'}
            </div>
            <div class="rcard-body">
              <div class="rcard-nome">${r.nome}</div>
              <div class="rcard-preco">${formatarKz(rPreco)}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    atualizarBotaoAdd();
  }
  
  function formatarKz(v) {
    return v.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
  }
  
  window.goSlide = function(idx) {
    const total = carouselImgs.length;
    if (!total) return;
    carouselIdx = (idx + total) % total;
    const track = document.getElementById('carousel-track');
    if (track) track.style.transform = `translateX(-${carouselIdx * 100}%)`;
    document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('on', i === carouselIdx));
  };
  
  window.qty = function(d) {
    qty = Math.max(1, Math.min(99, qty + d));
    document.getElementById('qty-val').textContent = qty;
    atualizarBotaoAdd();
  };
  
  function atualizarBotaoAdd() {
    if (!produto) return;
    const preco = produto.precoPromocional || produto.preco;
    document.getElementById('btn-add').textContent = `Adicionar — ${formatarKz(preco * qty)}`;
  }
  
  window.addCart = function() {
    if (!produto || !window.cart) return;
    window.cart.adicionarAoCarrinho(produto, qty);
    atualizarBadgeCarrinho();
    toast(`${produto.nome} adicionado ao carrinho!`, 'ok');
    
    const btn = document.getElementById('btn-add');
    const originalText = btn.textContent;
    btn.textContent = 'Ver Carrinho →';
    btn.style.background = 'linear-gradient(135deg, #22C55E, #16A34A)';
    btn.onclick = () => window.location.href = 'carrinho.html';
    
    clearTimeout(window._btnTimer);
    window._btnTimer = setTimeout(() => {
      btn.textContent = originalText;
      btn.style.background = '';
      btn.onclick = addCart;
    }, 4000);
  };
  
  function atualizarBadgeCarrinho() {
    const c = window.cart?.getCarrinho() || [];
    const q = c.reduce((s, i) => s + i.quantidade, 0);
    const badge = document.getElementById('badge-n');
    if (badge) {
      badge.textContent = q;
      badge.classList.toggle('on', q > 0);
    }
  }
  
  function atualizarBotaoWishlist() {
    if (!produto) return;
    const btn = document.getElementById('btn-wl');
    if (btn && window.favoritos) {
      const isWl = window.favoritos.estaNosFavoritos(produto.id);
      btn.innerHTML = isWl ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
    }
  }
  
  window.toggleWl = function() {
    if (!produto || !window.favoritos) return;
    const added = window.favoritos.alternarFavorito(produto);
    atualizarBotaoWishlist();
    toast(added ? 'Adicionado a wishlist' : 'Removido da wishlist', 'ok');
  };
  
  window.abrirLightbox = function() {
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbEmoji = document.getElementById('lb-emoji');
    
    if (carouselImgs[carouselIdx]) {
      lbImg.src = `imagens/produtos/${carouselImgs[carouselIdx]}`;
      lbImg.style.display = 'block';
      lbEmoji.style.display = 'none';
    } else {
      lbImg.style.display = 'none';
      lbEmoji.style.display = 'block';
    }
    lb.classList.add('on');
    document.body.style.overflow = 'hidden';
  };
  
  window.fecharLightbox = function() {
    document.getElementById('lightbox').classList.remove('on');
    document.body.style.overflow = '';
  };
  
  function toast(msg, tipo) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = `toast show ${tipo || 'ok'}`;
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }
  
  window.toggleTheme = function() {
    if (window.tema) window.tema.alternarTema();
    _syncThemeIcons();
  };
  
  function _syncThemeIcons() {
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    document.querySelectorAll('[data-theme-ico]').forEach(el => {
      el.className = theme === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
    });
  }
  
  setInterval(atualizarBadgeCarrinho, 500);
})();
</script>
</body>
</html>
