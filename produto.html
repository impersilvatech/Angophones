<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#06060E">
<title>Produto | Angophones</title>
<link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --red: #EF4444;
  --green: #22C55E;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
}
[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 80px;
  transition: background 0.3s, color 0.3s;
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }
.btn-bk {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.hdr-titulo {
  font-family: var(--ft);
  font-size: 1.2rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn-th {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.prod-hero {
  width: 100%;
  aspect-ratio: 1;
  max-height: 400px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.prod-hero img { width: 100%; height: 100%; object-fit: cover; }
.prod-emoji-big { font-size: 6rem; color: var(--muted2); opacity: 0.5; }
.carousel {
  width: 100%;
  aspect-ratio: 1;
  max-height: 400px;
  overflow: hidden;
  position: relative;
  background: var(--bg2);
}
.carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.35s;
}
.carousel-slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--bg2);
}
.carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
.carousel-slide i { font-size: 6rem; color: var(--muted2); opacity: 0.5; }
.carousel-dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 10;
}
.carousel-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
}
.carousel-dot.on { background: var(--primary); width: 18px; border-radius: 3px; }
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(6,6,14,0.7);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }
.tag-strip {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 12px;
  z-index: 5;
}
.prod-tag {
  padding: 4px 12px;
  font-family: var(--ft);
  font-size: 0.6rem;
  letter-spacing: 0.05em;
  border-radius: 50px;
  text-transform: uppercase;
}
.prod-tag.promo { background: var(--red); color: white; }
.prod-tag.destaque { background: var(--grad); color: white; }
.btn-zoom {
  padding: 7px 14px;
  background: rgba(6,6,14,0.85);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.6rem;
  color: white;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
.pd { padding: 18px 16px 8px; }
.pd-cat {
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--primary);
  opacity: 0.8;
  margin-bottom: 3px;
}
.pd-nome {
  font-family: var(--ft);
  font-size: 1.8rem;
  letter-spacing: 0.02em;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 8px;
}
.pd-preco { font-family: var(--ft); font-size: 1.5rem; color: var(--primary); margin-bottom: 5px; }
.pd-orig-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.pd-orig { font-size: 0.9rem; color: var(--muted2); text-decoration: line-through; }
.pd-pct { padding: 2px 8px; background: var(--red); color: white; font-family: var(--ft); font-size: 0.65rem; border-radius: 6px; }
.pd-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.divd { height: 1px; background: var(--border); margin: 14px 16px; }
.sec { padding: 0 16px; margin-bottom: 16px; }
.sec-t {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.qty-row { display: flex; align-items: center; }
.qty-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: none;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--white);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-btn:hover { background: var(--primary); border-color: var(--primary); }
.qty-val { min-width: 50px; text-align: center; font-family: var(--ft); font-size: 1.2rem; }
.specs-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.spec-row { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.spec-row:last-child { border-bottom: none; }
.spec-k {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted);
  min-width: 100px;
}
.spec-v { font-size: 0.85rem; color: var(--white); }
.related-scroll {
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 2px 16px 6px;
}
.related-scroll::-webkit-scrollbar { display: none; }
.related-inner { display: flex; gap: 10px; width: max-content; }
.rcard {
  width: 120px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  flex-shrink: 0;
}
.rcard-img {
  width: 100%;
  height: 100px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.rcard-img img { width: 100%; height: 100%; object-fit: cover; }
.rcard-img i { font-size: 2.5rem; color: var(--muted2); opacity: 0.5; }
.rcard-body { padding: 8px 9px 10px; }
.rcard-nome {
  font-family: var(--ft);
  font-size: 0.8rem;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 3px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.rcard-preco { font-family: var(--ft); font-size: 0.8rem; color: var(--primary); }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 600;
  background: rgba(0,0,0,0.97);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox.on { display: flex; }
.lb-img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 14px; }
.lb-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: none;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: 8px 16px 12px;
  display: flex;
  justify-content: space-around;
  background: rgba(6,6,14,0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
}
[data-theme="light"] .bottom-nav { background: rgba(245,245,247,0.97); }
.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-decoration: none;
}
.bottom-nav a i { font-size: 1.3rem; }
.bottom-nav a.active { color: var(--primary); }
.btn-add-nav {
  position: fixed;
  bottom: 80px;
  left: 16px;
  right: 16px;
  z-index: 200;
  padding: 14px;
  background: var(--grad);
  border: none;
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.95rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255,85,0,0.3);
  text-align: center;
}
.fab-whatsapp {
  position: fixed;
  bottom: 150px;
  right: 16px;
  width: 55px;
  height: 55px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 4px 16px rgba(37,211,102,0.4);
  z-index: 150;
  text-decoration: none;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  text-align: center;
  max-width: calc(100vw - 32px);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
@media (min-width: 769px) {
  .bottom-nav { display: none; }
  body { padding-bottom: 20px; }
  .btn-add-nav { bottom: 24px; left: 24px; right: 24px; max-width: 500px; margin: 0 auto; }
  .fab-whatsapp { bottom: 100px; }
}
</style>
</head>

<script>
// ========== TEMA ==========
function alternarTema() {
  const html = document.documentElement;
  const icon = document.querySelector('[data-theme-ico]');
  const temaAtual = html.getAttribute('data-theme') || 'dark';
  const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', novoTema);
  localStorage.setItem('tema', novoTema);
  if (icon) icon.className = novoTema === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#06060E' : '#F5F5F7');
}
(function() {
  const temaSalvo = localStorage.getItem('tema') || 'dark';
  document.documentElement.setAttribute('data-theme', temaSalvo);
  const icon = document.querySelector('[data-theme-ico]');
  if (icon) icon.className = temaSalvo === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
})();

// ========== DADOS ==========
const PRODUTOS = [
  { id: 1, nome: 'iPhone 15 Pro', categoria: 'smartphones', descricao: 'Titânio. Chip A17 Pro. Câmara de 48 MP. O iPhone mais Pro de sempre.', preco: 850000, precoPromocional: 799999, emPromocao: true, imagens: [], stock: 8, destaque: true, especificacoes: { 'Ecrã': '6.1" Super Retina XDR', 'Processador': 'A17 Pro', 'RAM': '8GB', 'Câmara': '48MP + 12MP + 12MP', 'Bateria': '3274 mAh' } },
  { id: 2, nome: 'Samsung Galaxy S24 Ultra', categoria: 'smartphones', descricao: 'O poder da IA no teu bolso. Caneta S Pen incluída.', preco: 920000, emPromocao: false, imagens: [], stock: 5, destaque: true, especificacoes: { 'Ecrã': '6.8" Dynamic AMOLED 2X', 'Processador': 'Snapdragon 8 Gen 3', 'RAM': '12GB', 'Câmara': '200MP + 50MP + 12MP + 10MP', 'Bateria': '5000 mAh' } },
  { id: 3, nome: 'Xiaomi 13T Pro', categoria: 'smartphones', descricao: 'Fotografia profissional com lentes Leica.', preco: 480000, precoPromocional: 449999, emPromocao: true, imagens: [], stock: 12, destaque: true, especificacoes: { 'Ecrã': '6.67" AMOLED 144Hz', 'Processador': 'Dimensity 9200+', 'RAM': '12GB', 'Câmara': '50MP + 50MP + 12MP', 'Bateria': '5000 mAh' } },
  { id: 4, nome: 'AirPods Pro 2ª Geração', categoria: 'acessorios', descricao: 'Cancelamento de ruído adaptativo e áudio espacial.', preco: 185000, precoPromocional: 169999, emPromocao: true, imagens: [], stock: 15, destaque: true, especificacoes: { 'Chip': 'H2', 'Autonomia': '6h (30h com case)', 'Resistência': 'IP54', 'Conectividade': 'Bluetooth 5.3' } },
  { id: 5, nome: 'Power Bank 20000mAh', categoria: 'acessorios', descricao: 'Carregamento rápido para até 3 dispositivos.', preco: 25000, imagens: [], stock: 20, especificacoes: { 'Capacidade': '20000mAh', 'Portas': '2x USB-A, 1x USB-C', 'Carregamento': 'Rápido 22.5W' } },
  { id: 6, nome: 'Capa Transparente iPhone 15', categoria: 'capas', descricao: 'Proteção fina e resistente.', preco: 8500, imagens: [], stock: 30 },
  { id: 7, nome: 'Carregador Rápido 20W USB-C', categoria: 'carregadores', descricao: 'Compatível com iPhone e Android.', preco: 12000, imagens: [], stock: 25, especificacoes: { 'Potência': '20W', 'Tipo': 'USB-C', 'Compatibilidade': 'iPhone, Android, Tablets' } },
  { id: 8, nome: 'iPad Air 11"', categoria: 'tablets', descricao: 'Chip M2. Liquid Retina.', preco: 520000, imagens: [], stock: 7, especificacoes: { 'Ecrã': '11" Liquid Retina', 'Chip': 'M2', 'Armazenamento': '128GB' } },
  { id: 9, nome: 'Samsung Galaxy Tab S9', categoria: 'tablets', descricao: 'Tablet premium com S Pen.', preco: 610000, imagens: [], stock: 4, especificacoes: { 'Ecrã': '11" Dynamic AMOLED 2X', 'Processador': 'Snapdragon 8 Gen 2', 'RAM': '12GB' } }
];

const CATEGORIAS = [
  { id: 'smartphones', nome: 'Smartphones' },
  { id: 'acessorios', nome: 'Acessórios' },
  { id: 'capas', nome: 'Capas' },
  { id: 'carregadores', nome: 'Carregadores' },
  { id: 'tablets', nome: 'Tablets' }
];

// ========== ESTADO ==========
let produto = null;
let qty = 1;
let carouselIdx = 0;
let carouselImgs = [];

// ========== STORAGE ==========
function getFavoritos() { try { return JSON.parse(localStorage.getItem('angophones_favoritos') || '[]'); } catch(e) { return []; } }
function salvarFavoritos(f) { try { localStorage.setItem('angophones_favoritos', JSON.stringify(f)); } catch(e) {} }
function getCarrinho() { try { return JSON.parse(localStorage.getItem('angophones_carrinho') || '[]'); } catch(e) { return []; } }
function salvarCarrinho(c) { try { localStorage.setItem('angophones_carrinho', JSON.stringify(c)); } catch(e) {} }

function formatarKz(v) {
  return v.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  t.style.borderLeftColor = tipo === 'err' ? '#EF4444' : '#FF5500';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ========== INICIALIZAR ==========
function inicializar() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  produto = PRODUTOS.find(p => p.id === id) || PRODUTOS[0];
  
  document.title = `${produto.nome} | Angophones`;
  document.getElementById('hdr-titulo').textContent = produto.nome;
  document.getElementById('pd-cat').textContent = CATEGORIAS.find(c => c.id === produto.categoria)?.nome || '';
  document.getElementById('pd-nome').textContent = produto.nome;
  
  const preco = produto.precoPromocional || produto.preco;
  document.getElementById('pd-preco').textContent = formatarKz(preco);
  
  if (produto.emPromocao && produto.preco) {
    document.getElementById('pd-orig').textContent = formatarKz(produto.preco);
    document.getElementById('pd-pct').textContent = `-${Math.round((1 - preco / produto.preco) * 100)}%`;
    document.getElementById('pd-orig-row').style.display = 'flex';
  }
  
  document.getElementById('pd-desc').textContent = produto.descricao || 'Sem descrição disponível.';
  
  // Carrossel / Hero
  carouselImgs = produto.imagens || [];
  const heroContainer = document.getElementById('hero-container');
  const tag = produto.emPromocao ? 'promo' : (produto.destaque ? 'destaque' : '');
  const tagLabel = { promo: 'PROMO', destaque: 'DESTAQUE' }[tag] || '';
  
  if (carouselImgs.length > 1) {
    const slides = carouselImgs.map((img, i) => `
      <div class="carousel-slide">
        <img src="imagens/produtos/${img}" alt="${produto.nome}" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-mobile-screen\'></i>'">
      </div>
    `).join('');
    const dots = carouselImgs.map((_, i) => `<div class="carousel-dot ${i===0?'on':''}" onclick="goSlide(${i})"></div>`).join('');
    heroContainer.innerHTML = `
      <div class="carousel">
        <div class="carousel-track" id="carousel-track">${slides}</div>
        <button class="carousel-btn prev" onclick="goSlide(carouselIdx-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="carousel-btn next" onclick="goSlide(carouselIdx+1)"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="carousel-dots">${dots}</div>
        <div class="tag-strip">
          ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
          <button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button>
        </div>
      </div>
    `;
  } else if (carouselImgs.length === 1) {
    heroContainer.innerHTML = `
      <div class="prod-hero">
        <img src="imagens/produtos/${carouselImgs[0]}" alt="${produto.nome}" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-mobile-screen prod-emoji-big\'></i>'">
        <div class="tag-strip">
          ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
          <button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button>
        </div>
      </div>
    `;
  } else {
    heroContainer.innerHTML = `
      <div class="prod-hero">
        <i class="fa-solid fa-mobile-screen prod-emoji-big"></i>
        <div class="tag-strip">
          ${tag ? `<span class="prod-tag ${tag}">${tagLabel}</span>` : '<span></span>'}
        </div>
      </div>
    `;
  }
  
  // Especificações
  if (produto.especificacoes && Object.keys(produto.especificacoes).length) {
    document.getElementById('sec-specs').style.display = 'block';
    document.getElementById('specs-card').innerHTML = Object.entries(produto.especificacoes)
      .map(([k, v]) => `<div class="spec-row"><span class="spec-k">${k}</span><span class="spec-v">${v}</span></div>`).join('');
  }
  
  // Relacionados
  const relacionados = PRODUTOS.filter(p => p.categoria === produto.categoria && p.id !== produto.id).slice(0, 6);
  if (relacionados.length) {
    document.getElementById('sec-rel').style.display = 'block';
    document.getElementById('rel-div').style.display = 'block';
    document.getElementById('rel-inner').innerHTML = relacionados.map(r => {
      const rPreco = r.precoPromocional || r.preco;
      return `<div class="rcard" onclick="window.location.href='produto.html?id=${r.id}'">
        <div class="rcard-img">${r.imagens?.[0] ? `<img src="imagens/produtos/${r.imagens[0]}" alt="${r.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>'}</div>
        <div class="rcard-body"><div class="rcard-nome">${r.nome}</div><div class="rcard-preco">${formatarKz(rPreco)}</div></div>
      </div>`;
    }).join('');
  }
  
  atualizarBotaoAdd();
  atualizarBotaoWishlist();
}

// ========== FUNÇÕES ==========
window.goSlide = function(idx) {
  if (!carouselImgs.length) return;
  carouselIdx = (idx + carouselImgs.length) % carouselImgs.length;
  document.getElementById('carousel-track').style.transform = `translateX(-${carouselIdx * 100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('on', i === carouselIdx));
};

window.qty = function(d) {
  qty = Math.max(1, Math.min(99, qty + d));
  document.getElementById('qty-val').textContent = qty;
  atualizarBotaoAdd();
};

function atualizarBotaoAdd() {
  const preco = produto.precoPromocional || produto.preco;
  document.getElementById('btn-add').textContent = `Adicionar ao Carrinho — ${formatarKz(preco * qty)}`;
}

window.addCart = function() {
  const carrinho = getCarrinho();
  const preco = produto.precoPromocional || produto.preco;
  const itemKey = `${produto.id}_padrao_padrao`;
  const existente = carrinho.find(i => i.itemKey === itemKey);
  if (existente) existente.quantidade += qty;
  else carrinho.push({ itemKey, id: produto.id, nome: produto.nome, preco, imagem: produto.imagens?.[0] || '', quantidade: qty, variante: null });
  salvarCarrinho(carrinho);
  toast(`${produto.nome} adicionado ao carrinho!`, 'ok');
  
  const btn = document.getElementById('btn-add');
  btn.textContent = 'Ver Carrinho →';
  btn.style.background = 'linear-gradient(135deg, #22C55E, #16A34A)';
  btn.onclick = () => window.location.href = 'carrinho.html';
  setTimeout(() => {
    btn.textContent = `Adicionar ao Carrinho — ${formatarKz((produto.precoPromocional || produto.preco) * qty)}`;
    btn.style.background = '';
    btn.onclick = addCart;
  }, 4000);
};

function atualizarBotaoWishlist() {
  const favoritos = getFavoritos();
  const isWl = favoritos.some(f => f.id === produto.id);
  const btn = document.getElementById('btn-wl');
  btn.innerHTML = isWl ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
}

window.toggleWl = function() {
  const favoritos = getFavoritos();
  const index = favoritos.findIndex(f => f.id === produto.id);
  if (index === -1) favoritos.push({ id: produto.id, nome: produto.nome, preco: produto.precoPromocional || produto.preco });
  else favoritos.splice(index, 1);
  salvarFavoritos(favoritos);
  atualizarBotaoWishlist();
  toast(index === -1 ? 'Adicionado aos favoritos' : 'Removido dos favoritos', 'ok');
};

window.abrirLightbox = function() {
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  if (carouselImgs[carouselIdx]) {
    lbImg.src = `imagens/produtos/${carouselImgs[carouselIdx]}`;
    lbImg.style.display = 'block';
  }
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
};

window.fecharLightbox = function() {
  document.getElementById('lightbox').classList.remove('on');
  document.body.style.overflow = '';
};

inicializar();
</script>
</body>
