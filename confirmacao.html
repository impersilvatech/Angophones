<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#06060E">
<title>Confirmar Pedido | Angophones</title>
<link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --green: #22C55E;
  --red: #EF4444;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
}
[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 30px;
  transition: background 0.3s, color 0.3s;
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }
.hdr-nome {
  font-family: var(--ft);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  color: var(--white);
}
.hdr-nome span { color: var(--primary); }
.hb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.container { padding: 16px; max-width: 600px; margin: 0 auto; }
.progresso {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
}
.progresso-step {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--muted);
}
.step-num.completed {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.step-num.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.step-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.progresso-line {
  width: 30px;
  height: 2px;
  background: var(--border);
}
.progresso-line.completed {
  background: var(--primary);
}
.confirmacao-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}
.confirmacao-titulo {
  font-family: var(--ft);
  font-size: 1.3rem;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
  color: var(--primary);
}
.cliente-info {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.cliente-item {
  display: flex;
  margin-bottom: 10px;
}
.cliente-item i {
  width: 26px;
  color: var(--primary);
  font-size: 1rem;
}
.cliente-item span {
  color: var(--muted);
}
.itens-pedido {
  margin-bottom: 16px;
}
.item-pedido {
  display: flex;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.item-pedido:last-child {
  border-bottom: none;
}
.item-img {
  width: 50px;
  height: 50px;
  border-radius: 8px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.item-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.item-img i {
  font-size: 1.8rem;
  color: var(--muted2);
}
.item-info {
  flex: 1;
}
.item-nome {
  font-weight: 600;
  margin-bottom: 4px;
}
.item-detalhes {
  font-size: 0.8rem;
  color: var(--muted);
}
.item-preco {
  text-align: right;
  font-family: var(--ft);
  color: var(--primary);
  font-size: 1rem;
}
.resumo-linha {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 8px;
}
.resumo-linha.total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-family: var(--ft);
  font-size: 1.2rem;
  color: var(--white);
}
.resumo-linha.total span:last-child {
  color: var(--primary);
}
.nota-box {
  margin-top: 16px;
  padding: 12px;
  background: var(--bg2);
  border-radius: 12px;
  border-left: 3px solid var(--primary);
}
.nota-box i {
  color: var(--primary);
  margin-right: 8px;
}
.nota-box span {
  color: var(--muted);
  font-size: 0.9rem;
}
.btn-whatsapp {
  width: 100%;
  padding: 18px;
  background: #25D366;
  border: none;
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
  margin-bottom: 12px;
}
.btn-voltar {
  width: 100%;
  padding: 14px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  cursor: pointer;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  text-align: center;
  max-width: calc(100vw - 32px);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
@media (min-width: 769px) {
  body { padding-bottom: 0; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-nome">Ango<span>phones</span></div>
  <button class="hb" onclick="alternarTema()">
    <i data-theme-ico class="fa-regular fa-sun"></i>
  </button>
</header>

<div class="container">
  <div class="progresso">
    <div class="progresso-step">
      <span class="step-num completed"><i class="fa-solid fa-check"></i></span>
      <span class="step-label">Carrinho</span>
    </div>
    <div class="progresso-line completed"></div>
    <div class="progresso-step">
      <span class="step-num completed"><i class="fa-solid fa-check"></i></span>
      <span class="step-label">Dados</span>
    </div>
    <div class="progresso-line completed"></div>
    <div class="progresso-step">
      <span class="step-num active">3</span>
      <span class="step-label">Confirmar</span>
    </div>
  </div>

  <div class="confirmacao-card" id="confirmacao-content">
    <!-- Preenchido via JS -->
  </div>

  <button class="btn-whatsapp" onclick="enviarWhatsApp()">
    <i class="fa-brands fa-whatsapp"></i> Enviar Pedido pelo WhatsApp
  </button>
  <button class="btn-voltar" onclick="window.location.href='dados.html'">
    <i class="fa-solid fa-arrow-left"></i> Voltar e Editar Dados
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== TEMA ==========
function alternarTema() {
  const html = document.documentElement;
  const icon = document.querySelector('[data-theme-ico]');
  const temaAtual = html.getAttribute('data-theme') || 'dark';
  const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
  
  html.setAttribute('data-theme', novoTema);
  localStorage.setItem('tema', novoTema);
  
  if (icon) {
    icon.className = novoTema === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
  
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#06060E' : '#F5F5F7');
}

(function() {
  const temaSalvo = localStorage.getItem('tema') || 'dark';
  document.documentElement.setAttribute('data-theme', temaSalvo);
  const icon = document.querySelector('[data-theme-ico]');
  if (icon) {
    icon.className = temaSalvo === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
})();

// ========== DADOS ==========
function getCarrinho() {
  const c = localStorage.getItem('angophones_carrinho');
  return c ? JSON.parse(c) : [];
}

function getSubtotal() {
  return getCarrinho().reduce((t, i) => t + (i.preco * i.quantidade), 0);
}

function getCupao() {
  return JSON.parse(localStorage.getItem('angophones_cupao') || 'null');
}

function getDesconto() {
  const cupao = getCupao();
  if (!cupao) return 0;
  const subtotal = getSubtotal();
  if (cupao.tipo === 'percentual') return Math.round(subtotal * cupao.valor / 100);
  return Math.min(cupao.valor, subtotal);
}

function formatarKz(v) {
  return v.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
}

// ========== INICIALIZAR ==========
function inicializar() {
  const carrinho = getCarrinho();
  const dadosCliente = JSON.parse(localStorage.getItem('angophones_cliente') || '{}');
  
  if (!carrinho.length) {
    window.location.href = 'carrinho.html';
    return;
  }
  
  if (!dadosCliente.nome) {
    window.location.href = 'dados.html';
    return;
  }
  
  renderizarConfirmacao(carrinho, dadosCliente);
}

function renderizarConfirmacao(carrinho, dados) {
  const container = document.getElementById('confirmacao-content');
  const subtotal = getSubtotal();
  const desconto = getDesconto();
  const cupao = getCupao();
  const isGratis = subtotal >= 50000;
  const valorEntrega = dados.tipoEntrega === 'levantamento' ? 0 : (isGratis ? 0 : 1500);
  const total = subtotal - desconto + valorEntrega;
  
  let html = `
    <h2 class="confirmacao-titulo">Confirme seu Pedido</h2>
    
    <div class="cliente-info">
      <div class="cliente-item">
        <i class="fa-solid fa-user"></i>
        <span><strong>${dados.nome}</strong></span>
      </div>
      <div class="cliente-item">
        <i class="fa-solid fa-phone"></i>
        <span>${dados.telefone}</span>
      </div>
      <div class="cliente-item">
        <i class="fa-solid fa-location-dot"></i>
        <span>${dados.provincia}, ${dados.municipio}${dados.bairro ? ', ' + dados.bairro : ''}</span>
      </div>
      <div class="cliente-item">
        <i class="fa-solid fa-truck"></i>
        <span>${dados.tipoEntrega === 'levantamento' ? 'Levantamento na Loja' : 'Entrega ao Domicílio'}</span>
      </div>
    </div>
    
    <h3 style="font-family:var(--ft);margin-bottom:12px;letter-spacing:0.05em;">Itens do Pedido</h3>
    <div class="itens-pedido">
  `;
  
  carrinho.forEach(item => {
    const precoTotal = item.preco * item.quantidade;
    html += `
      <div class="item-pedido">
        <div class="item-img">
          ${item.imagem ? `<img src="imagens/produtos/${item.imagem}" alt="${item.nome}">` : '<i class="fa-solid fa-mobile-screen"></i>'}
        </div>
        <div class="item-info">
          <div class="item-nome">${item.nome}</div>
          <div class="item-detalhes">${item.quantidade} x ${formatarKz(item.preco)}</div>
          ${item.variante ? `<div class="item-detalhes">${item.variante}</div>` : ''}
        </div>
        <div class="item-preco">${formatarKz(precoTotal)}</div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  if (dados.notas) {
    html += `
      <div class="nota-box">
        <i class="fa-regular fa-note-sticky"></i>
        <span>${dados.notas}</span>
      </div>
    `;
  }
  
  html += `
    <div style="margin-top:16px;">
      <div class="resumo-linha">
        <span>Subtotal</span>
        <span>${formatarKz(subtotal)}</span>
      </div>
  `;
  
  if (desconto > 0) {
    html += `
      <div class="resumo-linha" style="color: var(--green);">
        <span>Desconto ${cupao ? '(' + cupao.codigo + ')' : ''}</span>
        <span>-${formatarKz(desconto)}</span>
      </div>
    `;
  }
  
  let entregaTexto = formatarKz(valorEntrega);
  if (dados.tipoEntrega === 'levantamento') entregaTexto = 'Grátis (Levantamento)';
  else if (isGratis) entregaTexto = 'Grátis';
  
  html += `
      <div class="resumo-linha">
        <span>Entrega</span>
        <span>${entregaTexto}</span>
      </div>
      <div class="resumo-linha total">
        <span>Total</span>
        <span>${formatarKz(total)}</span>
      </div>
    </div>
  `;
  
  container.innerHTML = html;
}

function gerarMensagemWhatsApp() {
  const carrinho = getCarrinho();
  const dados = JSON.parse(localStorage.getItem('angophones_cliente') || '{}');
  const subtotal = getSubtotal();
  const desconto = getDesconto();
  const cupao = getCupao();
  const isGratis = subtotal >= 50000;
  const valorEntrega = dados.tipoEntrega === 'levantamento' ? 0 : (isGratis ? 0 : 1500);
  const total = subtotal - desconto + valorEntrega;
  
  let msg = `*NOVO PEDIDO - Angophones*\n\n`;
  msg += `Cliente: ${dados.nome}\n`;
  msg += `Telefone: ${dados.telefone}\n`;
  msg += `Local: ${dados.provincia}, ${dados.municipio}${dados.bairro ? ', ' + dados.bairro : ''}\n`;
  msg += `Entrega: ${dados.tipoEntrega === 'levantamento' ? 'Levantamento na Loja' : 'Entrega ao Domicílio'}\n`;
  
  if (dados.notas) msg += `Notas: ${dados.notas}\n`;
  
  msg += `\n*PRODUTOS:*\n`;
  carrinho.forEach((item, i) => {
    msg += `${i+1}. ${item.nome}`;
    if (item.variante) msg += ` (${item.variante})`;
    msg += `\n   ${item.quantidade} x ${formatarKz(item.preco)} = ${formatarKz(item.preco * item.quantidade)}\n`;
  });
  
  msg += `\nSubtotal: ${formatarKz(subtotal)}`;
  if (desconto > 0) msg += `\nDesconto (${cupao?.codigo}): -${formatarKz(desconto)}`;
  
  let entregaTexto = formatarKz(valorEntrega);
  if (dados.tipoEntrega === 'levantamento') entregaTexto = 'Grátis';
  else if (isGratis) entregaTexto = 'Grátis';
  msg += `\nEntrega: ${entregaTexto}`;
  msg += `\n\n*TOTAL: ${formatarKz(total)}*`;
  msg += `\n\nAguardamos confirmacao.`;
  
  return msg;
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  t.style.borderLeftColor = tipo === 'err' ? '#EF4444' : '#FF5500';
  setTimeout(() => t.classList.remove('show'), 3000);
}

function enviarWhatsApp() {
  const mensagem = gerarMensagemWhatsApp();
  const numero = '244954288128';
  
  // Limpar carrinho e dados
  localStorage.removeItem('angophones_carrinho');
  localStorage.removeItem('angophones_cupao');
  localStorage.removeItem('angophones_cliente');
  
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, '_blank');
  
  toast('Pedido enviado! Redirecionando...', 'ok');
  
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 2000);
}

inicializar();
</script>
</body>
</html>
