<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#06060E">
<title>Dados de Entrega | Angophones</title>
<link rel="icon" href="tema/assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060E;
  --bg2: #0A0A14;
  --card: #0F0F13;
  --border: #2A2A2E;
  --primary: #FF5500;
  --red: #EF4444;
  --green: #22C55E;
  --white: #FFFFFF;
  --muted: #A0A0A8;
  --muted2: #6B6B76;
  --ft: 'Bebas Neue', 'Impact', sans-serif;
  --fb: 'Outfit', sans-serif;
  --grad: linear-gradient(135deg, #FF5500, #FF7A33);
}
[data-theme="light"] {
  --bg: #F5F5F7;
  --bg2: #FFFFFF;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --white: #1C1C1E;
  --muted: #6B6B76;
  --muted2: #8E8E93;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 30px;
  transition: background 0.3s, color 0.3s;
}
.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 6, 14, 0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
[data-theme="light"] .hdr { background: rgba(245, 245, 247, 0.97); }
.hdr-nome {
  font-family: var(--ft);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  color: var(--white);
}
.hdr-nome span { color: var(--primary); }
.hb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: none;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--white);
}
.container { padding: 16px; max-width: 500px; margin: 0 auto; }
.progresso {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
}
.progresso-step {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--muted);
}
.step-num.completed {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.step-num.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.step-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.progresso-line {
  width: 30px;
  height: 2px;
  background: var(--border);
}
.progresso-line.completed {
  background: var(--primary);
}
.form-group {
  margin-bottom: 20px;
}
.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--white);
}
.form-label i {
  width: 22px;
  color: var(--primary);
}
.form-control {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: var(--fb);
  font-size: 0.95rem;
  color: var(--white);
  outline: none;
  transition: border-color 0.2s;
}
.form-control:focus {
  border-color: var(--primary);
}
.form-control::placeholder {
  color: var(--muted2);
}
.form-select {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: var(--fb);
  font-size: 0.95rem;
  color: var(--white);
  outline: none;
}
.entrega-opcoes {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}
.entrega-opt {
  flex: 1;
  padding: 14px;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.entrega-opt i {
  font-size: 1.5rem;
  margin-bottom: 6px;
  display: block;
  color: var(--muted);
}
.entrega-opt span {
  font-size: 0.8rem;
  font-weight: 500;
}
.entrega-opt.active {
  border-color: var(--primary);
  background: rgba(255, 85, 0, 0.05);
}
.entrega-opt.active i {
  color: var(--primary);
}
.resumo-pedido {
  margin-top: 24px;
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.resumo-titulo {
  font-family: var(--ft);
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  color: var(--primary);
}
.resumo-linha {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 8px;
}
.resumo-linha.total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-family: var(--ft);
  font-size: 1.2rem;
  color: var(--white);
}
.resumo-linha.total span:last-child {
  color: var(--primary);
}
.btn-continuar {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  background: var(--grad);
  border: none;
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 1rem;
  letter-spacing: 0.05em;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255, 85, 0, 0.3);
}
.btn-voltar {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-family: var(--ft);
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  cursor: pointer;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  text-align: center;
  max-width: calc(100vw - 32px);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
@media (min-width: 769px) {
  body { padding-bottom: 0; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-nome">Ango<span>phones</span></div>
  <button class="hb" onclick="alternarTema()">
    <i data-theme-ico class="fa-regular fa-sun"></i>
  </button>
</header>

<div class="container">
  <div class="progresso">
    <div class="progresso-step">
      <span class="step-num completed"><i class="fa-solid fa-check"></i></span>
      <span class="step-label">Carrinho</span>
    </div>
    <div class="progresso-line completed"></div>
    <div class="progresso-step">
      <span class="step-num active">2</span>
      <span class="step-label">Dados</span>
    </div>
    <div class="progresso-line"></div>
    <div class="progresso-step">
      <span class="step-num">3</span>
      <span class="step-label">Confirmar</span>
    </div>
  </div>

  <form id="form-dados">
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-user"></i> Nome Completo</label>
      <input type="text" class="form-control" id="nome" placeholder="Ex: João da Silva" value="">
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-phone"></i> Telefone (WhatsApp)</label>
      <input type="tel" class="form-control" id="telefone" placeholder="Ex: 923 456 789" value="">
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-location-dot"></i> Província</label>
      <select class="form-select" id="provincia">
        <option value="">Selecione a província...</option>
        <option value="Bengo">Bengo</option>
        <option value="Benguela">Benguela</option>
        <option value="Bié">Bié</option>
        <option value="Cabinda">Cabinda</option>
        <option value="Cuando Cubango">Cuando Cubango</option>
        <option value="Cuanza Norte">Cuanza Norte</option>
        <option value="Cuanza Sul">Cuanza Sul</option>
        <option value="Cunene">Cunene</option>
        <option value="Huambo">Huambo</option>
        <option value="Huíla">Huíla</option>
        <option value="Luanda" selected>Luanda</option>
        <option value="Lunda Norte">Lunda Norte</option>
        <option value="Lunda Sul">Lunda Sul</option>
        <option value="Malanje">Malanje</option>
        <option value="Moxico">Moxico</option>
        <option value="Namibe">Namibe</option>
        <option value="Uíge">Uíge</option>
        <option value="Zaire">Zaire</option>
      </select>
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-city"></i> Município</label>
      <input type="text" class="form-control" id="municipio" placeholder="Ex: Luanda" value="">
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-map-pin"></i> Bairro / Referência</label>
      <input type="text" class="form-control" id="bairro" placeholder="Ex: Maianga, perto da...">
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-truck"></i> Tipo de Entrega</label>
      <div class="entrega-opcoes">
        <div class="entrega-opt active" data-tipo="entrega">
          <i class="fa-solid fa-truck"></i>
          <span>Entrega</span>
        </div>
        <div class="entrega-opt" data-tipo="levantamento">
          <i class="fa-solid fa-store"></i>
          <span>Levantamento</span>
        </div>
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label"><i class="fa-regular fa-note-sticky"></i> Notas (opcional)</label>
      <textarea class="form-control" id="notas" rows="2" placeholder="Observações sobre a entrega..."></textarea>
    </div>
  </form>
  
  <div class="resumo-pedido" id="resumo-pedido">
    <div class="resumo-titulo">Resumo do Pedido</div>
    <div class="resumo-linha">
      <span>Subtotal</span>
      <span id="resumo-subtotal">0,00 Kz</span>
    </div>
    <div class="resumo-linha" id="resumo-desconto-linha" style="display:none; color: var(--green);">
      <span>Desconto <span id="cupao-codigo"></span></span>
      <span id="resumo-desconto">0,00 Kz</span>
    </div>
    <div class="resumo-linha">
      <span>Entrega</span>
      <span id="resumo-entrega">0,00 Kz</span>
    </div>
    <div class="resumo-linha total">
      <span>Total</span>
      <span id="resumo-total">0,00 Kz</span>
    </div>
  </div>
  
  <button class="btn-continuar" onclick="continuar()">
    <i class="fa-solid fa-arrow-right"></i> Continuar para Confirmação
  </button>
  <button class="btn-voltar" onclick="window.location.href='carrinho.html'">
    <i class="fa-solid fa-arrow-left"></i> Voltar ao Carrinho
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== TEMA ==========
function alternarTema() {
  const html = document.documentElement;
  const icon = document.querySelector('[data-theme-ico]');
  const temaAtual = html.getAttribute('data-theme') || 'dark';
  const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
  
  html.setAttribute('data-theme', novoTema);
  localStorage.setItem('tema', novoTema);
  
  if (icon) {
    icon.className = novoTema === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
  
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', novoTema === 'dark' ? '#06060E' : '#F5F5F7');
}

(function() {
  const temaSalvo = localStorage.getItem('tema') || 'dark';
  document.documentElement.setAttribute('data-theme', temaSalvo);
  const icon = document.querySelector('[data-theme-ico]');
  if (icon) {
    icon.className = temaSalvo === 'dark' ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
  }
})();

// ========== CARRINHO SIMPLES (LocalStorage) ==========
function getCarrinho() {
  const c = localStorage.getItem('angophones_carrinho');
  return c ? JSON.parse(c) : [];
}

function getSubtotal() {
  return getCarrinho().reduce((t, i) => t + (i.preco * i.quantidade), 0);
}

function getCupao() {
  return JSON.parse(localStorage.getItem('angophones_cupao') || 'null');
}

function getDesconto() {
  const cupao = getCupao();
  if (!cupao) return 0;
  const subtotal = getSubtotal();
  if (cupao.tipo === 'percentual') return Math.round(subtotal * cupao.valor / 100);
  return Math.min(cupao.valor, subtotal);
}

function formatarKz(v) {
  return v.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
}

let tipoEntrega = 'entrega';

// ========== INICIALIZAR ==========
function inicializar() {
  const carrinho = getCarrinho();
  if (!carrinho.length) {
    window.location.href = 'carrinho.html';
    return;
  }
  
  // Carregar dados salvos
  const dados = JSON.parse(localStorage.getItem('angophones_cliente') || '{}');
  if (dados.nome) document.getElementById('nome').value = dados.nome;
  if (dados.telefone) document.getElementById('telefone').value = dados.telefone;
  if (dados.provincia) document.getElementById('provincia').value = dados.provincia;
  if (dados.municipio) document.getElementById('municipio').value = dados.municipio;
  if (dados.bairro) document.getElementById('bairro').value = dados.bairro || '';
  if (dados.notas) document.getElementById('notas').value = dados.notas || '';
  if (dados.tipoEntrega) {
    tipoEntrega = dados.tipoEntrega;
    document.querySelectorAll('.entrega-opt').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.tipo === tipoEntrega);
    });
  }
  
  atualizarResumo();
}

// ========== EVENTOS ==========
document.querySelectorAll('.entrega-opt').forEach(opt => {
  opt.addEventListener('click', function() {
    document.querySelectorAll('.entrega-opt').forEach(o => o.classList.remove('active'));
    this.classList.add('active');
    tipoEntrega = this.dataset.tipo;
    atualizarResumo();
  });
});

function atualizarResumo() {
  const subtotal = getSubtotal();
  const desconto = getDesconto();
  const cupao = getCupao();
  const isGratis = subtotal >= 50000;
  const valorEntrega = tipoEntrega === 'levantamento' ? 0 : (isGratis ? 0 : 1500);
  const total = subtotal - desconto + valorEntrega;
  
  document.getElementById('resumo-subtotal').textContent = formatarKz(subtotal);
  
  const descontoLinha = document.getElementById('resumo-desconto-linha');
  if (desconto > 0) {
    descontoLinha.style.display = 'flex';
    document.getElementById('cupao-codigo').textContent = cupao ? `(${cupao.codigo})` : '';
    document.getElementById('resumo-desconto').textContent = `-${formatarKz(desconto)}`;
  } else {
    descontoLinha.style.display = 'none';
  }
  
  let entregaTexto = formatarKz(valorEntrega);
  if (tipoEntrega === 'levantamento') entregaTexto = 'Grátis (Levantamento)';
  else if (isGratis) entregaTexto = 'Grátis';
  document.getElementById('resumo-entrega').textContent = entregaTexto;
  
  document.getElementById('resumo-total').textContent = formatarKz(total);
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  t.style.borderLeftColor = tipo === 'err' ? '#EF4444' : '#FF5500';
  setTimeout(() => t.classList.remove('show'), 3000);
}

function continuar() {
  const nome = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const provincia = document.getElementById('provincia').value;
  const municipio = document.getElementById('municipio').value.trim();
  const bairro = document.getElementById('bairro').value.trim();
  const notas = document.getElementById('notas').value.trim();
  
  if (!nome || !telefone || !provincia || !municipio) {
    toast('Preencha todos os campos obrigatórios', 'err');
    return;
  }
  
  const dados = { nome, telefone, provincia, municipio, bairro, tipoEntrega, notas };
  localStorage.setItem('angophones_cliente', JSON.stringify(dados));
  
  window.location.href = 'confirmacao.html';
}

inicializar();
</script>
</body>
</html>
